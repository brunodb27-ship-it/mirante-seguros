<style>
/* Paleta: base grafite quase preta (estilo TradeMap), laranja como cor de ação e um degradê laranja→roxo→azul (estilo Gemini) só na marca, na aba ativa e no fio do topo.
   Layout: barra fixa com marca, busca e abas; abaixo, uma "mesa" por aba (buscador, ficha, simulador). Números em mono tabular. */

  --bg:#0a0c11; --panel:#11141b; --panel2:#181c25; --line:#232937; --fg:#eceef4; --muted:#8b93a7; --faint:#5c6478;

  color-scheme:dark;
}

/* ===== Repaginada 2026-11 (Bull & Bear): base clara fria, bloco escuro de destaque, cartões arredondados.
   Laranja = touro (ação, preço), roxo = urso (comparações, dividendos). Sobrepõe as regras acima. ===== */
:root{
  --bg:#0A0D13; --panel:#121722; --panel2:#1A2030; --line:#252C3B; --fg:#ECEFF5; --muted:#97A2B5; --faint:#66718A;
  --accent:#FF7A2E; --accent2:#A88BFF; --accent3:#5B9BFF; --accent-ink:#1A0A02; --accent-soft:rgba(255,122,46,.13); --accent2-soft:rgba(168,139,255,.14);
  --up:#3DD68C; --down:#FF6B78; --up-soft:rgba(61,214,140,.13); --down-soft:rgba(255,107,120,.13);
  --s1:#FF7A2E; --s2:#A88BFF; --s3:#5B9BFF; --s4:#97A2B5; --c1:#FF7A2E; --c2:#A88BFF; --c3:#5B9BFF;
  --hero:#161C28; --hero-line:#2A3242; --hero-fg:#FFFFFF; --hero-muted:#A3AEC0; --hero-chip:#222A3A; --hero-up:#6EE7A8; --hero-up-bg:#10301F; --hero-down:#FF9AA3; --hero-down-bg:#3A1418;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r-card:20px; --r-ctl:12px;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F4F7; --panel:#FFFFFF; --panel2:#EEF1F5; --line:#E3E7ED; --fg:#0B0F17; --muted:#5B6576; --faint:#8A94A6;
  --accent:#C9420C; --accent2:#6741D9; --accent3:#2F6FE0; --accent-ink:#FFFFFF; --accent-soft:rgba(217,72,15,.09); --accent2-soft:rgba(103,65,217,.09);
  --up:#0F7A4A; --down:#C0262D; --up-soft:rgba(15,122,74,.09); --down-soft:rgba(192,38,45,.09);
  --s1:#D9480F; --s2:#6741D9; --s3:#2F6FE0; --s4:#6B7586; --c1:#D9480F; --c2:#6741D9; --c3:#2F6FE0;
  --hero:#0B0F17; --hero-line:#0B0F17; --hero-chip:#1C2230; --hero-muted:#9AA5B5}}
:root[data-theme="light"]{
  --bg:#F2F4F7; --panel:#FFFFFF; --panel2:#EEF1F5; --line:#E3E7ED; --fg:#0B0F17; --muted:#5B6576; --faint:#8A94A6;
  --accent:#C9420C; --accent2:#6741D9; --accent3:#2F6FE0; --accent-ink:#FFFFFF; --accent-soft:rgba(217,72,15,.09); --accent2-soft:rgba(103,65,217,.09);
  --up:#0F7A4A; --down:#C0262D; --up-soft:rgba(15,122,74,.09); --down-soft:rgba(192,38,45,.09);
  --s1:#D9480F; --s2:#6741D9; --s3:#2F6FE0; --s4:#6B7586; --c1:#D9480F; --c2:#6741D9; --c3:#2F6FE0;
  --hero:#0B0F17; --hero-line:#0B0F17; --hero-chip:#1C2230; --hero-muted:#9AA5B5}
body{font-size:14.5px}
/* topo */
.top{background:var(--panel);backdrop-filter:none}
.top::after{display:none}
.top-in{max-width:1400px;padding:10px 24px;gap:10px 24px}
.brand .logo{height:52px;border-radius:12px;box-shadow:none}
@media(max-width:600px){.brand .logo{height:44px}}
.search input{height:44px;border-radius:var(--r-ctl);background:var(--panel2);padding:0 14px}
nav.tabs{background:none;border:0;padding:0;gap:4px}
nav.tabs button{padding:8px 14px;border-radius:999px;font-weight:500;color:var(--muted)}
nav.tabs button:hover{color:var(--fg);background:var(--panel2)}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);font-weight:600}
nav.tabs button[aria-selected="true"]::after{display:none}
/* estrutura */
main{max-width:1400px;padding:28px 24px 56px;gap:24px}
.card{border-radius:var(--r-card)}
.card-h{padding:20px 24px 4px;border-bottom:0}
.card-h h2{font-size:20px;font-weight:700;letter-spacing:-.005em;text-transform:none}
.card-b{padding:16px 24px 22px}
.two{gap:24px}
.btn{border-radius:10px;padding:8px 14px;background:var(--panel)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.inp{border-radius:10px;padding:8px 10px}
.seg{border:0;border-radius:var(--r-ctl);padding:4px;gap:4px}
.seg button{border-radius:9px;padding:6px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(11,15,23,.10),0 0 0 1px var(--line)}
.chip{border-radius:999px;padding:3px 10px}
.banner{border-radius:14px}
.selbox{border-radius:14px}
.sugs{border-radius:14px;box-shadow:0 12px 32px rgba(11,15,23,.16)}
th{font-size:11px;padding:10px 8px}
td{padding:9px 8px}
.tk{font-size:14.5px}
.card>.tbl-wrap th:first-child,.card>.tbl-wrap td:first-child{padding-left:24px}.card>.tbl-wrap th:last-child,.card>.tbl-wrap td:last-child{padding-right:24px}
.grp h3{font-size:12px;color:var(--accent2)}
/* indicadores em cartões */
.kpis{gap:12px;background:none;border:0;border-radius:0;overflow:visible}
.kpi{border:1px solid var(--line);border-radius:16px;padding:16px 18px;gap:4px}
.kpi .lab{font-size:11.5px;font-weight:600}
.kpi .val{font-size:22px}
/* ficha: bloco de destaque */
.hero2{background:var(--hero);border:1px solid var(--hero-line);color:var(--hero-fg);border-radius:24px;padding:34px 38px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px 48px}
.hero2 .l{display:flex;flex-direction:column;gap:10px;min-width:0}
.hero2 .chips{margin:0;gap:8px}
.hero2 .chip{border:0;background:var(--hero-chip);color:#C9D1DD;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px}
.hero2 .name{font-family:var(--f-display);font-weight:800;font-size:clamp(52px,8vw,96px);line-height:.95;letter-spacing:-.03em}
.hero2 .sub{font-size:18px;color:#C9D1DD}
.hero2 .r{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.hero2 .when{font-size:13px;color:var(--hero-muted)}
.hero2 .px{font-family:var(--f-mono);font-weight:600;font-size:clamp(38px,5.4vw,64px);line-height:1;letter-spacing:-.02em}
.hero2 .pills{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.hero2 .pill{font-family:var(--f-mono);font-size:13.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--hero-chip);color:#C9D1DD}
.hero2 .pill.up{background:var(--hero-up-bg);color:var(--hero-up)} .hero2 .pill.down{background:var(--hero-down-bg);color:var(--hero-down)}
.hero2 .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.hero2 .acts .btn{height:44px;padding:0 20px;border-radius:12px;font-size:14px;font-weight:600}
.hero2 .acts .btn.ghost{background:transparent;border-color:#3A4456;color:#FFFFFF}
@media(max-width:700px){.hero2{padding:24px 20px;border-radius:20px}.hero2 .r{align-items:flex-start}.hero2 .pills{justify-content:flex-start}}
.kpi.dest{border:2px solid var(--accent);padding:15px 17px}
.kpi .ref{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.kpi .ref.bom{color:var(--up)} .kpi .ref.ruim{color:var(--down)}
/* contra o setor e a bolsa */
.cmp-leg{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12.5px;color:var(--muted)}
.cmp-leg span{display:inline-flex;align-items:center;gap:8px}
.cmp-leg i{display:inline-block}
.cmp-leg .lb{width:22px;height:12px;border-radius:4px;background:var(--accent)}
.cmp-leg .ld{width:12px;height:12px;border-radius:50%;border:3px solid var(--accent2);background:var(--panel)}
.cmp-leg .lt{width:3px;height:18px;border-radius:2px;background:var(--fg)}
.cmp-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:12px 0;border-top:1px solid var(--line)}
.cmp-row:first-child{border-top:0}
.cmp-row .nm{flex:0 0 190px;display:flex;flex-direction:column}
.cmp-row .nm b{font-weight:600} .cmp-row .nm small{font-size:12px;color:var(--muted)}
.cmp-row .tr{flex:1 1 300px;min-width:0;position:relative;height:28px;background:var(--panel2);border-radius:8px}
.cmp-row .z{position:absolute;top:0;bottom:0;width:1px;background:var(--faint);opacity:.6}
.cmp-row .b{position:absolute;top:6px;height:16px;border-radius:5px;background:var(--accent)}
.cmp-row .t{position:absolute;top:-2px;height:32px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--fg)}
.cmp-row .d{position:absolute;top:7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:3px solid var(--accent2);background:var(--panel)}
.cmp-row .vs{flex:0 0 300px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-family:var(--f-mono);font-size:13.5px;text-align:right}
.cmp-row .vs span{color:var(--muted)} .cmp-row .vs b{font-weight:600}
.cmp-row .vd{flex:0 0 140px;font-size:13px;font-weight:600;text-align:right;color:var(--muted)}
.cmp-row .vd.bom{color:var(--up)} .cmp-row .vd.ruim{color:var(--down)}
.cmp-head{display:flex;justify-content:flex-end;gap:24px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cmp-head .vs{flex:0 0 300px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:right}
.cmp-head .vd{flex:0 0 140px}
.sem-setor .vs{flex-basis:200px;grid-template-columns:repeat(2,minmax(0,1fr))}.sem-setor .vs>:nth-child(2){display:none}
@media(max-width:760px){.cmp-row .nm,.cmp-row .vs,.cmp-row .vd{flex-basis:100%}.cmp-row .vd{text-align:left}.cmp-head{display:none}}
</style>
</head>

const dyDe=r=>{ const y=ok(r.dy)?r.dy:null, c=ok(r.dy_cvm)?r.dy_cvm:null; if(c!=null&&(r.mercado||'Brasil')==='Brasil'&&(y==null||y<c*0.3)) return c; return y??c; };

async function getJSON(p){ const r=await fetch(p,{cache:'no-cache'}); if(!r.ok) throw new Error(p+' '+r.status); return r.json(); }
// A Alpha Vantage entrega o preço de fechamento SEM ajuste de desdobramento, mas os proventos já ajustados.
// Detecta desdobramentos/grupamentos pelo salto entre o preço ajustado e o bruto e corrige o preço.
function ajustaDesdobramentos(h){
  const n=h.d.length, f=new Array(n).fill(1), cand=[2,3,4,5,8,10,20,50,100]; let cum=1; h.sp=[];
  for(let i=n-1;i>0;i--){
    f[i]=cum;
    const k=(h.a[i]/h.a[i-1])/(h.c[i]/h.c[i-1]); let s=1;
    if(k>1.45){ const m=cand.find(x=>Math.abs(k/x-1)<0.1); if(m) s=m; }
    else if(k<0.7){ const m=cand.find(x=>Math.abs(k*x-1)<0.1); if(m) s=1/m; }
    if(s!==1) h.sp.push([h.d[i],s]);
    cum*=s;
  }
  f[0]=cum; h.c=h.c.map((x,i)=>x/f[i]);
}
// A Alpha Vantage grátis aceita 1 consulta por segundo e 25 por dia: as consultas da prévia vão em fila,
// com intervalo, e o resultado fica guardado neste navegador por 12 horas para não gastar a cota de novo.
let avFila=Promise.resolve(), avUltima=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const HKEY='painel-acoes-hist-';
function histCache(t,h){ try{ if(h){ localStorage.setItem(HKEY+t,JSON.stringify({at:Date.now(),h})); return; } const x=JSON.parse(localStorage.getItem(HKEY+t)||'null'); if(x&&Date.now()-x.at<12*3600e3) return x.h; }catch{} return null; }
async function avChamada(mcp,t){
  const vez=avFila.then(async()=>{ const esp=1300-(Date.now()-avUltima); if(esp>0) await sleep(esp); avUltima=Date.now();
    return mcp.callTool('Alpha Vantage MCP Server','TIME_SERIES_MONTHLY_ADJUSTED',{symbol:marketOf(t)==='US'?t:t+'.SAO',datatype:'csv'},{cache:{staleTime:300000,gcTime:86400000}}); });
  avFila=vez.catch(()=>{}); return vez;
}
async function loadHist(t){
  if(S.hist[t]) return S.hist[t];
  try{ S.hist[t]=await getJSON('data/hist/'+t+'.json'); S.hist[t].s=1; return S.hist[t]; }catch{}
  const c=histCache(t); if(c){ S.hist[t]=c; return c; }
  // prévia dentro do Claude: busca o histórico mensal pela Alpha Vantage (conector do usuário)
  try{
    const mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null;
    if(!mcp) return null;
    let p=null;
    for(let tent=0;tent<3;tent++){
      const res=await avChamada(mcp,t);
      p=res.payload; if(p&&typeof p==='object'&&typeof p.result==='string') p=p.result;
      const txt=typeof p==='string'?p:JSON.stringify(p||'');
      if(/25 requests per day|per day/i.test(txt)){ S.avErro='A Alpha Vantage grátis chegou ao limite de 25 consultas hoje. Amanhã volta; no site do GitHub esse limite não existe.'; return null; }
      if(/1 request per second|rate limit|spreading out/i.test(txt)){ await sleep(2000+tent*1500); continue; }
      break;
    }
    if(typeof p!=='string') return null;
    const lines=p.trim().split(/\r?\n/).slice(1).map(l=>l.split(',')).filter(x=>x.length>=8).reverse();
    if(!lines.length) return null;
    const h={d:lines.map(x=>x[0].slice(0,7)),c:lines.map(x=>+x[4]),a:lines.map(x=>+x[5]),v:lines.map(x=>+x[7]),s:0,src:'Alpha Vantage'};
    ajustaDesdobramentos(h); S.hist[t]=h; histCache(t,h);
    return h;
  }catch(e){ console.warn(e); return null; }
}

  ['Crescimento (só B3)',[['cagr_receita','Crescimento da receita por ano','p'],['cagr_lucro','Crescimento do lucro por ano','p']]],
];
const RK_INFO=Object.fromEntries(RK_CRIT.flatMap(([,l])=>l.map(([k,lab,t])=>[k,{lab,t}])));
const RK_COLS=[['ret_total','Retorno total'],['cagr_total','Ao ano'],['dy_medio','DY médio'],['m_ebit_med','Marg. EBIT méd.'],['roe_med','ROE méd.'],['anos_lucro','Anos c/ lucro']];

function rkCompleto(m,k,n){
  if(RK_PRECO.includes(k)) return !!m.preco_completo;
  if(RK_DIV.includes(k)) return (m.anos_div_base||0)>=n;
  return (m.anos_balanco||0)>=n;
}
function rkFmt(v,k,n){
  if(!ok(v)) return '—';
  if(k==='anos_div'||k==='anos_lucro') return v+' de '+n;
  return fP(v,1,['ret_total','ret_preco','cagr_total','cagr_receita','cagr_lucro'].includes(k));
}
function rkLista(){
  const R=S.rank, q=S.rk, n=+q.n, k=q.crit; if(!R) return [];
  let out=[];
  for(const r of S.rows){
    const m=(R.dados[r.ticker]||{})[q.n]; if(!m||!ok(m[k])) continue;
    if(q.mercado&&(r.mercado||'Brasil')!==q.mercado) continue;
    if(q.setor&&r.setor!==q.setor) continue;
    if(isFinite(num(q.liq))&&!(ok(r.liquidez)&&r.liquidez>=num(q.liq)*1000)) continue;
    if(q.completo&&!rkCompleto(m,k,n)) continue;
    if(['m_ebit_med','m_liq_med','roe_med','cagr_receita','cagr_lucro','anos_lucro'].includes(k)&&r.setor==='ETF') continue;
    out.push({r,m});
  }
  const d=q.asc?1:-1;
  out.sort((a,b)=>d*(a.m[k]-b.m[k])||((b.m.ret_total??-9)-(a.m.ret_total??-9)));
  return out;
}

function sgLado(x,v){
  v=v||S.sg.visao; if(!x) return ['—',''];
  if(v==='ambos'){
    return ({convergencia_compra:['Compra: fundamentos + gráfico','bom'],convergencia_venda:['Venda: fundamentos + gráfico','ruim'],
      grafico_compra:['Gráfico comprador','bom2'],grafico_venda:['Gráfico vendedor','ruim2'],fundamentos_bons:['Boa e barata, gráfico neutro','bom2'],
      boa_empresa_grafico_fraco:['Boa empresa, gráfico fraco','aviso'],neutro:['Neutro','']})[x.sinal]||['Neutro',''];
  }
  const s=sgScore(x,v); if(!ok(s)) return ['—',''];
  if(v==='fund') return s>=65?['Atrativa','bom']:s<=35?['Pouco atrativa','ruim']:['Neutra',''];
  return s>=65?['Compra','bom']:s<=35?['Venda','ruim']:['Neutro',''];
}
function sgBarra(s){ if(!ok(s)) return '<span class="muted">—</span>';
  const c=s>=65?'var(--up)':s<=35?'var(--down)':'var(--muted)';
  return `<span class="sgbar"><i style="width:${Math.max(3,s)}%;background:${c}"></i></span><b style="color:${c}">${s}</b>`; }
function sgTag(nome,tipo){ return `<span class="sgtag ${tipo==='alta'?'bom':tipo==='baixa'?'ruim':''}">${esc(nome)}</span>`; }
function sgDestaques(x,v){
  v=v||S.sg.visao; const out=[];
  if(x.t&&v!=='fund'){ [...x.t.sinais].filter(s=>s.pontos).sort((a,b)=>Math.abs(b.pontos)-Math.abs(a.pontos)).slice(0,v==='tec'?4:3).forEach(s=>out.push(sgTag(s.nome,s.tipo))); }
  if(x.f&&v!=='tec'){ const its=[...x.f.itens].sort((a,b)=>Math.abs(b.nota-.5)*b.peso-Math.abs(a.nota-.5)*a.peso).slice(0,v==='fund'?4:2);
    its.forEach(i=>out.push(sgTag(i.nome+(i.nota>=.5?' ✓':' ✗'),i.nota>=.67?'alta':i.nota<=.33?'baixa':''))); }
  return out.join(' ');
}
function sgLista(){
  const q=S.sg, v=q.visao; if(!S.sinais) return [];
  let out=[];
  for(const r of S.rows){
    const x=sgDe(r.ticker); const s=sgScore(x,v); if(!ok(s)) continue;
    if(v==='ambos'&&!(x.f&&x.t)) continue;   // ETFs e índices não têm balanço: aparecem na visão Técnica
    if(q.mercado&&(r.mercado||'Brasil')!==q.mercado) continue;
    if(q.setor&&r.setor!==q.setor) continue;
    if(isFinite(num(q.liq))&&!(ok(r.liquidez)&&r.liquidez>=num(q.liq)*1000)) continue;
    const [,tom]=sgLado(x,v);
    if(q.lado==='compra'&&!/^bom/.test(tom)) continue;
    if(q.lado==='venda'&&!/^ruim|aviso/.test(tom)) continue;
    if(q.padrao&&!(x.t&&x.t.sinais.some(s=>s.nome===q.padrao))) continue;
    out.push({r,x,s});
  }
  const d=q.lado==='venda'?1:-1;
  out.sort((a,b)=>d*(a.s-b.s)||((b.r.liquidez||0)-(a.r.liquidez||0)));
  return out;
}

function sgConc(x){
  if(!x||!x.f||!x.t) return null; if(x.conc) return x.conc;
  const f=x.f.score,t=x.t.score, l=s=>s>=55?1:s<=45?-1:0, lf=l(f), lt=l(t);
  if(lf&&lt&&lf!==lt) return 'baixa'; if(lf&&lf===lt) return ((f>=65||f<=35)&&(t>=65||t<=35))?'alta':'media'; return (lf||lt)?'media':'sem_direcao';

const _med={};
function mediana(xs){ if(!xs.length) return null; const a=[...xs].sort((x,y)=>x-y), m=a.length>>1; return a.length%2?a[m]:(a[m-1]+a[m])/2; }
function valorInd(x,k){ return k==='dy'?dyDe(x):x[k]; }
function valido(k,v){ if(!ok(v)) return false;
  if(['pl','pvp','psr','ev_ebitda','ev_ebit'].includes(k)) return v>0&&v<200;   // negativos (prejuízo) e extremos distorcem a mediana
  if(['m_bruta','m_ebit','m_liq'].includes(k)) return v>-1&&v<=1;
  if(k==='dy') return v>=0&&v<0.6;
  return Math.abs(v)<1e3; }
function refGrupo(r,k){

  const porEmp=xs=>{ const vistos=new Set(), out=[]; for(const x of xs){ const id=x.empresa||x.ticker; if(vistos.has(id)) continue; const v=valorInd(x,k); if(valido(k,v)){ vistos.add(id); out.push(v);} } return out; };

function refMercado(r,k){

function padroesCandle(O,H,L,C,i,lim){
  const out=[]; if(!O||!H||!L||!C||i<6) return out;
  const vals=[O[i],H[i],L[i],C[i],O[i-1],C[i-1],C[i-6]]; if(!vals.every(v=>ok(v)&&v>0)) return out;
  if(L[i]>Math.min(O[i],C[i])*1.001||H[i]<Math.max(O[i],C[i])*0.999) return out;
  const caiu=C[i-1]<C[i-6]*(1-lim), subiu=C[i-1]>C[i-6]*(1+lim);
  const corpo=Math.abs(C[i]-O[i]), faixa=Math.max(H[i]-L[i],1e-9), sup=H[i]-Math.max(O[i],C[i]), inf=Math.min(O[i],C[i])-L[i], m=Math.max(corpo,faixa*.05);
  if(corpo<=faixa*.35&&inf>=2*m&&sup<=faixa*.15){ if(caiu) out.push(['Martelo','alta']); else if(subiu) out.push(['Enforcado','baixa']); }
  if(corpo<=faixa*.35&&sup>=2*m&&inf<=faixa*.15){ if(subiu) out.push(['Estrela cadente','baixa']); else if(caiu) out.push(['Martelo invertido','alta']); }
  const o0=O[i-1], c0=C[i-1];
  if(o0>c0&&C[i]>O[i]&&C[i]>=o0&&O[i]<=c0&&caiu) out.push(['Engolfo de alta','alta']);
  if(c0>o0&&O[i]>C[i]&&O[i]>=c0&&C[i]<=o0&&subiu) out.push(['Engolfo de baixa','baixa']);
  if(corpo<=faixa*.08) out.push(['Doji','neutro']);
  return out;
}

// Impostos (pessoa física residente no Brasil, regras vigentes em 2026, simplificadas):

function simPath(h, labels, valor, aporte, reinv, semDiv, fx, opc, tax){
  if(!h._ix) h._ix=Object.fromEntries(h.d.map((d,i)=>[d,i]));
  const mOpc=opc?Math.pow(1+opc,1/12)-1:0;   // renda de opções: % ao ano sobre o valor da posição, recebida mês a mês
  const out=[], inv=[]; let acoes=0, cash=0, divs=0, premios=0, invested=0, prev=null, base=0, irPago=0;
  const tDiv=tax?tax.div:0, tOpc=tax?tax.opc:0;
  labels.forEach((lb,k)=>{
    let i=h._ix[lb]; if(i==null) i=prev;
    const f=fx?(fx(lb)||1):1;
    if(k===0){ acoes=valor/f; invested=valor; base=valor; }
    else{
      if(i!==prev&&prev!=null){
        acoes*=h.c[i]/h.c[prev];
        const bruto=semDiv?0:acoes*(h.v[i]||0)/h.c[i], d=bruto*(1-tDiv); divs+=d*f; irPago+=bruto*tDiv*f;
        if(reinv){ acoes+=d; base+=d*f; } else cash+=d*f;
      }
      if(mOpc&&!semDiv){ const bruto=acoes*mOpc, pr=bruto*(1-tOpc); premios+=pr*f; irPago+=bruto*tOpc*f; if(reinv){ acoes+=pr; base+=pr*f; } else cash+=pr*f; }
      if(aporte){ acoes+=aporte/f; invested+=aporte; base+=aporte; }
    }
    prev=i; out.push(acoes*f+cash); inv.push(invested);
  });
  const posicao=acoes*(fx?(fx(labels.at(-1))||1):1), irVenda=tax?Math.max(0,posicao-base)*tax.venda:0;
  return {out,inv,divs,premios,invested,irPago,irVenda};
}

function fxSim(t,labels){ const fx=fxFn(t); if(!fx||!S.sim.semCambio) return fx; const f0=fx(labels[0]); return ()=>f0; }
// índice de inflação acumulada (IPCA) para trazer cada mês a reais do último mês
function fatorInflacao(labels){ const ip=S.macro&&S.macro.ipca; if(!ip) return null; let acc=1; const idx=labels.map((lb,i)=>{ if(i>0) acc*=1+((ip[lb]??0)/100); return acc; }); const fim=idx.at(-1); return idx.map(v=>fim/v); }
// investido acumulado mês a mês, em reais de hoje (para o gráfico)
function investidoAcumCorr(labels,valor,aporte){ const f=fatorInflacao(labels); let t=0; return labels.map((_,i)=>{ t+=(i===0?valor:aporte)*f[i]; return t; }); }
function investidoCorrigido(labels,valor,aporte){ const f=fatorInflacao(labels); if(!f) return null; let tot=valor*f[0]; for(let i=1;i<labels.length;i++) tot+=aporte*f[i]; return tot; }
function simBench(labels, valor, aporte, kind){
  const m=S.macro; if(!m) return null; const out=[]; let v=valor;
  if(kind==='cdi'||kind==='ipca'){ const s=m[kind]; if(!s) return null; for(let i=0;i<labels.length;i++){ if(i>0){ const r=s[labels[i]]; if(r==null) return null; v=v*(1+r/100)+aporte; } out.push(v);} return out; }
  if(kind==='ibov'){ const s=m.ibov; if(!s) return null; let q=valor/(s[labels[0]]||NaN); if(!isFinite(q)) return null; for(let i=0;i<labels.length;i++){ const p=s[labels[i]]; if(p==null) return null; if(i>0&&aporte) q+=aporte/p; out.push(q*p);} return out; }
}

// rentabilidade média ao ano (TIR): considera cada aporte no mês em que entrou.
// fluxos: valor inicial no mês 0, aporte nos meses 1..n e o valor final no último mês. f = fator de correção por mês (opcional).
function tirAnual(labels, valor, aporte, fim, f){
  const n=labels.length-1; if(n<1||!(fim>0)||!(valor>0||aporte>0)) return null;
  const fl=k=>(k===0?valor:aporte)*(f?f[k]:1);
  const vpl=r=>{ let v=0, d=1; for(let k=0;k<=n;k++){ v-=fl(k)/d; if(k===n) v+=fim/d; d*=1+r; } return v; };
  let lo=-0.99, hi=1; if(vpl(lo)*vpl(hi)>0) return null;
  for(let i=0;i<200;i++){ const m=(lo+hi)/2; if(vpl(lo)*vpl(m)<=0) hi=m; else lo=m; }
  return Math.pow(1+(lo+hi)/2,12)-1;
}

// ===================== simulador de renda fixa =====================
// Produtos e regras (pessoa física, 2026):
//  CDB/LC/Tesouro: IR regressivo sobre o rendimento de cada aporte (22,5% até 180 dias, 20% até 360, 17,5% até 720, 15% acima).
//  LCI/LCA/Poupança: isentos de IR.  Tesouro Direto: taxa de custódia da B3 de 0,20% ao ano (no Tesouro Selic, só acima de R$ 10 mil).
//  Poupança: com Selic acima de 8,5%, rende 0,5% ao mês + TR (a TR não entra na conta).
const RF_PRODUTOS={
  cdb:{nome:'CDB / LC',ir:true,tipos:['cdi','pre','ipca'],padrao:{tipo:'cdi',taxa:100}},
  lci:{nome:'LCI / LCA',ir:false,tipos:['cdi','pre','ipca'],padrao:{tipo:'cdi',taxa:90}},
  selic:{nome:'Tesouro Selic',ir:true,custodia:0.002,isentoAte:10000,tipos:['cdi'],padrao:{tipo:'cdi',taxa:100}},
  pre:{nome:'Tesouro Prefixado',ir:true,custodia:0.002,tipos:['pre'],padrao:{tipo:'pre',taxa:13.5}},
  ipca:{nome:'Tesouro IPCA+',ir:true,custodia:0.002,tipos:['ipca'],padrao:{tipo:'ipca',taxa:7}},
  poup:{nome:'Poupança',ir:false,tipos:['poup'],padrao:{tipo:'poup',taxa:0}},
  livre:{nome:'Taxa livre (sem IR)',ir:false,tipos:['pre'],padrao:{tipo:'pre',taxa:1,taxaUn:'am'}},
};
const RF_TIPO={cdi:'% do CDI',pre:'Prefixado',ipca:'IPCA +',poup:'Regra da poupança'};
function acum12(serie){ if(!serie) return null; const k=Object.keys(serie).sort().slice(-12); if(k.length<12) return null;
  const d=new Date(); d.setMonth(d.getMonth()-4); const limite=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  if(k.at(-1)<limite) return null;   // série desatualizada: melhor não usar
  return k.reduce((a,x)=>a*(1+serie[x]/100),1)-1; }
function rfPadroes(){ const r=S.rf;
  if(r.cdi==null){ const c=acum12(S.macro&&S.macro.cdi); r.cdi=c!=null?+(c*100).toFixed(2):14.15; r.cdiFonte=c!=null?'últimos 12 meses':'estimativa'; }
  if(r.ipca==null){ const i=acum12(S.macro&&S.macro.ipca); r.ipca=i!=null?+(i*100).toFixed(2):4.5; r.ipcaFonte=i!=null?'últimos 12 meses':'estimativa'; } }
function aliqIR(dias){ return dias<=180?0.225:dias<=360?0.20:dias<=720?0.175:0.15; }
function taxaMensal(r){
  const aa=x=>Math.pow(1+x,1/12)-1;
  if(r.tipo==='cdi') return aa(r.cdi/100*r.taxa/100);
  if(r.tipo==='pre') return r.taxaUn==='am'?r.taxa/100:aa(r.taxa/100);
  if(r.tipo==='ipca') return aa((1+r.ipca/100)*(1+(r.taxaUn==='am'?Math.pow(1+r.taxa/100,12)-1:r.taxa/100))-1);
  if(r.tipo==='poup') return 0.005;
  return 0;
}
// Simula mês a mês, com cada aporte guardado como um lote (para o IR regressivo pela idade de cada aporte)
function simRF(cfg){
  const P=RF_PRODUTOS[cfg.produto], m=taxaMensal(cfg), n=cfg.meses, cust=P.custodia?Math.pow(1+P.custodia,1/12)-1:0;
  const lotes=[{ini:cfg.valor,saldo:cfg.valor,mes:0}], serie=[cfg.valor], inv=[cfg.valor]; let investido=cfg.valor, custodiaPaga=0;
  for(let t=1;t<=n;t++){
    const total=lotes.reduce((a,l)=>a+l.saldo,0);
    lotes.forEach(l=>{ l.saldo*=1+m; });
    if(cust){ const tot=lotes.reduce((a,l)=>a+l.saldo,0), isento=P.isentoAte||0, base=Math.max(0,tot-isento), c=base*cust; if(c>0&&tot>0){ lotes.forEach(l=>{ l.saldo-=c*l.saldo/tot; }); custodiaPaga+=c; } }
    if(cfg.aporte&&t<n){ lotes.push({ini:cfg.aporte,saldo:cfg.aporte,mes:t}); investido+=cfg.aporte; }
    serie.push(lotes.reduce((a,l)=>a+l.saldo,0)); inv.push(investido);
  }
  const bruto=serie.at(-1); let ir=0;
  if(P.ir) lotes.forEach(l=>{ const g=l.saldo-l.ini; if(g>0) ir+=g*aliqIR((n-l.mes)*30); });
  return {bruto,ir,liquido:bruto-ir,investido,custodia:custodiaPaga,serie,inv,mensal:m};
}
function rfMeses(r){ return Math.max(1,Math.round(r.unidade==='anos'?r.prazo*12:r.prazo)); }
function vRF(){
  rfPadroes(); const r=S.rf, P=RF_PRODUTOS[r.produto];
  const tipos=P.tipos; if(!tipos.includes(r.tipo)) r.tipo=tipos[0];
  const taxaLabel=r.tipo==='cdi'?'Taxa (% do CDI)':r.tipo==='ipca'?'Juro acima do IPCA':r.tipo==='poup'?'':'Taxa';
  return `
  <section class="card"><div class="card-h"><h2>Simulador</h2>
    <div class="seg">${[['uma','Uma ação'],['carteira','Carteira'],['rf','Renda fixa']].map(([k,l])=>`<button data-smodo="${k}" aria-pressed="${S.sim.modo===k}">${l}</button>`).join('')}</div></div>
   <div class="card-b sim-form rf-form">
    <div class="f"><label for="rf-produto">Investimento</label><select class="inp" id="rf-produto">${Object.entries(RF_PRODUTOS).map(([k,v])=>`<option value="${k}" ${k===r.produto?'selected':''}>${v.nome}</option>`).join('')}</select></div>
    ${tipos.length>1?`<div class="f"><label for="rf-tipo">Rentabilidade</label><select class="inp" id="rf-tipo">${tipos.map(t=>`<option value="${t}" ${t===r.tipo?'selected':''}>${RF_TIPO[t]}</option>`).join('')}</select></div>`:''}
    ${r.tipo!=='poup'?`<div class="f"><label for="rf-taxa">${taxaLabel}</label><div class="pair"><input class="inp" id="rf-taxa" inputmode="decimal" value="${fN(r.taxa,2)}">${r.tipo==='cdi'?'<span class="muted" style="align-self:center">%</span>':`<select class="inp" id="rf-taxaun" aria-label="Unidade da taxa"><option value="aa" ${r.taxaUn==='aa'?'selected':''}>% ao ano</option><option value="am" ${r.taxaUn==='am'?'selected':''}>% ao mês</option></select>`}</div></div>`:''}

// número em reais aceitando "8.000.000", "8000000", "8.000.000,50" ou "8000000.5"
function numBR(s){ s=String(s??'').trim().replace(/[R$\s]/g,''); if(!s) return NaN;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) return parseFloat(s.replace(/\./g,'').replace(',','.'));
  return num(s); }
// série mensal histórica da carteira: % em ações (Ibovespa, já com dividendos) + resto em CDI; IPCA para a inflação
function libHist(){
  const M=S.macro; if(!M||!M.ibov||!M.cdi||!M.ipca) return null;
  const ks=Object.keys(M.ipca).filter(k=>k>='2000-02'&&M.cdi[k]!=null&&M.ibov[k]!=null).sort();
  const prev=k=>{ let [y,m]=k.split('-').map(Number); m--; if(!m){ m=12; y--; } return y+'-'+String(m).padStart(2,'0'); };
  return ks.filter(k=>M.ibov[prev(k)]!=null).map(k=>({m:k,acao:M.ibov[k]/M.ibov[prev(k)]-1,rf:M.cdi[k]/100,inf:M.ipca[k]/100}));
}
function libMedia(H,mix,anos){
  const x=H.slice(-anos*12); if(x.length<anos*12*0.9) return null;
  let v=1,p=1; for(const r of x){ v*=1+mix*r.acao+(1-mix)*r.rf; p*=1+r.inf; }
  const n=x.length/12; return {ret:Math.pow(v,1/n)-1, inf:Math.pow(p,1/n)-1, de:x[0].m, ate:x.at(-1).m};
}
// projeção com retorno médio constante (mês a mês)
function libProjeta(L,ret,inf,taxaOverride){
  const meses=L.prazo*12, rm=Math.pow(1+ret*(1-L.ir/100),1/12)-1, im=Math.pow(1+inf,1/12)-1;
  let P=L.patrimonio, W=taxaOverride!=null?L.patrimonio*taxaOverride/12:(L.modo==='taxa'?L.patrimonio*L.taxa/100/12:L.saque), defl=1, acabou=null, sacado=0;
  const pts=[{ano:0,nom:P,real:P,saque:W}];
  for(let k=0;k<meses;k++){
    if(k>0&&k%12===0&&L.corrige) W*=Math.pow(1+inf,1);
    const s=Math.min(W,Math.max(P,0)); P-=s; sacado+=s/defl;
    if(P<=0&&acabou==null){ acabou=k; P=0; }
    P*=1+rm; defl*=1+im;
    if((k+1)%12===0) pts.push({ano:(k+1)/12,nom:P,real:P/defl,saque:W});
  }
  return {pts,acabou,final:P,finalReal:P/defl,W0:pts[0].saque,sacadoReal:sacado};
}
// teste com a história real: começa em cada janeiro desde 2000 e vai até o prazo ou até hoje
function libHistorico(L,H,mix){
  const out=[];
  for(let i=0;i<H.length;i++){
    if(!H[i].m.endsWith('-01')) continue;
    let P=L.patrimonio, W=L.modo==='taxa'?L.patrimonio*L.taxa/100/12:L.saque, defl=1, acabou=null, minReal=1, n=0, inf12=1;
    const fim=Math.min(H.length,i+L.prazo*12);
    for(let j=i;j<fim;j++){
      const r=H[j]; if(n>0&&n%12===0&&L.corrige){ W*=inf12; inf12=1; }
      P-=Math.min(W,P); if(P<=0&&acabou==null){ acabou=n; P=0; }
      let g=mix*r.acao+(1-mix)*r.rf; if(g>0) g*=1-L.ir/100;
      P*=1+g; defl*=1+r.inf; inf12*=1+r.inf; n++;
      minReal=Math.min(minReal,P/defl/L.patrimonio);
    }
    out.push({ini:H[i].m.slice(0,4),anos:n/12,finalReal:P/defl/L.patrimonio,minReal,acabou,completo:n>=L.prazo*12});
  }
  return out;
}
function libPadroes(){
  const L=S.lib; if(L.ret!=null||!S.macro) return;
  const H=libHist(); const m=H&&libMedia(H,L.acoes/100,L.janela);
  L.ret=m?+(m.ret*100).toFixed(2):10; L.inf=m?+(m.inf*100).toFixed(2):4.5; L.fonte=m?`média de ${m.de.slice(5)}/${m.de.slice(0,4)} a ${m.ate.slice(5)}/${m.ate.slice(0,4)}`:'estimativa';
}
function vLib(){
  if(!S.macro) return `<div class="card"><div class="empty">Carregando o histórico de CDI, IPCA e Ibovespa…</div></div>`;
  libPadroes(); const L=S.lib;

    <div class="f"><label for="lb-acoes">% da carteira em ações${info('Quanto da carteira fica em ações; o resto fica em renda fixa.\n\nAções seguem o Ibovespa (com dividendos reinvestidos). Renda fixa segue o CDI.\n\nMais ações costuma dar mais retorno, mas com quedas maiores no caminho.')}</label><input class="inp" id="lb-acoes" inputmode="numeric" value="${L.acoes}" title="O resto fica em renda fixa rendendo CDI"></div>
    <div class="f"><label for="lb-janela">Média histórica de${info('Período do passado usado para preencher o retorno e a inflação.\n\nEx.: 20 anos = média de 10/2006 a 09/2026.\n\nPeríodos diferentes dão resultados bem diferentes: vale testar mais de um.')}</label><select class="inp" id="lb-janela">${[5,10,15,20,25].map(a=>`<option value="${a}" ${a===L.janela?'selected':''}>${a} anos</option>`).join('')}</select></div>
    <div class="f"><label for="lb-ret">Retorno ao ano (%)${info('Quanto a carteira rende por ano, antes de descontar inflação e imposto.\n\nVem preenchido com a média histórica da carteira escolhida. Você pode digitar outro valor para testar cenários.')}</label><input class="inp" id="lb-ret" inputmode="decimal" value="${fN(L.ret,2)}" title="Padrão: ${esc(L.fonte)} da carteira escolhida. Mude para testar cenários."></div>

function lerLib(){ const L=S.lib, g=id=>document.getElementById(id); if(!g('lb-pat')) return;
  const acoesAnt=L.acoes, janAnt=L.janela;
  L.patrimonio=Math.max(0,numBR(g('lb-pat').value)||0);
  L.modo=g('lb-modo').value;
  if(g('lb-taxa')) L.taxa=Math.max(0,num(g('lb-taxa').value)||0);
  if(g('lb-saque')) L.saque=Math.max(0,numBR(g('lb-saque').value)||0);
  if(L.modo==='valor'&&!g('lb-saque')) L.saque=Math.round(L.patrimonio*L.taxa/100/12);
  if(L.modo==='taxa'&&!g('lb-taxa')) L.taxa=+(L.saque*12/Math.max(1,L.patrimonio)*100).toFixed(2);
  L.acoes=Math.min(100,Math.max(0,Math.round(num(g('lb-acoes').value)||0)));
  L.janela=+g('lb-janela').value;
  L.ret=num(g('lb-ret').value); L.inf=num(g('lb-inf').value); L.ir=Math.max(0,num(g('lb-ir').value)||0);
  L.prazo=Math.min(80,Math.max(1,Math.round(num(g('lb-prazo').value)||30)));
  L.corrige=g('lb-corrige').checked;
  if(L.acoes!==acoesAnt||L.janela!==janAnt||!isFinite(L.ret)||!isFinite(L.inf)){ L.ret=null; libPadroes(); }
}
function runLib(){
  const box=$('#lib-out'); if(!box||!S.macro) return; const L=S.lib;
  const ret=L.ret/100, inf=L.inf/100, R=libProjeta(L,ret,inf);
  const retLiq=ret*(1-L.ir/100), real=(1+retLiq)/(1+inf)-1;
  // taxa máxima que preserva o poder de compra e taxa máxima que dura o prazo
  let lo=0, hi=0.5; for(let k=0;k<50;k++){ const mid=(lo+hi)/2, x=libProjeta({...L,modo:'taxa'},ret,inf,mid); if(x.acabou==null&&x.final>1) lo=mid; else hi=mid; }
  const taxaPrazo=lo;
  // taxa que termina o prazo com o mesmo poder de compra do início (mesma regra de saque da simulação)
  lo=0; hi=0.5; for(let k=0;k<50;k++){ const mid=(lo+hi)/2, x=libProjeta({...L,modo:'taxa'},ret,inf,mid); if(x.acabou==null&&x.finalReal>=L.patrimonio) lo=mid; else hi=mid; }
  const taxaPerpetua=lo;
  const W0=R.W0, taxaAtual=W0*12/Math.max(1,L.patrimonio);
  const dura=R.acabou==null?`Dura os ${L.prazo} anos`:`Acaba em ${fN(R.acabou/12,1)} anos`;
  const H=libHist(), hist=H?libHistorico(L,H,L.acoes/100):[];
  const comp=hist.filter(h=>h.completo), ok_=comp.filter(h=>h.acabou==null);
  const acima=hist.filter(h=>h.finalReal>=1).length;
  const labs=R.pts.map(p=>p.ano);
  box.innerHTML=`<div style="display:grid;gap:18px">
   <section class="kpis">
    <div class="kpi"><span class="lab">Saque por mês hoje${info('Quanto você saca por mês no primeiro ano. Nos anos seguintes esse valor sobe com a inflação.')}</span><span class="val">${fR(W0)}</span><span class="sub muted">${fP(taxaAtual,2)} ao ano do patrimônio · ${fR(W0*12)} por ano</span></div>
    <div class="kpi"><span class="lab">Retorno acima da inflação${info('Rendimento real: o que sobra por ano depois de descontar a inflação (e o imposto, se preenchido). É isso que de fato aumenta o seu poder de compra.')}</span><span class="val ${cls(real)}">${fP(real,2)} ao ano</span><span class="sub muted">${fP(ret,2)} bruto${L.ir?` · ${fP(retLiq,2)} após imposto`:''} · inflação ${fP(inf,2)}</span></div>
    <div class="kpi"><span class="lab">${dura}${info('Se o dinheiro aguenta o prazo e quanto sobra no fim, já descontada a inflação (em reais de hoje).')}</span><span class="val ${R.acabou==null?'up':'down'}">${R.acabou==null?fR(R.finalReal):'R$ 0'}</span><span class="sub muted">${R.acabou==null?`patrimônio no fim, em reais de hoje (${fP(R.finalReal/L.patrimonio-1,0,true)} de poder de compra)`:'o dinheiro acaba antes do prazo'}</span></div>
    <div class="kpi"><span class="lab">Saque que preserva o patrimônio${info('O maior saque que termina o prazo com o mesmo poder de compra do início. Sacando isso ou menos, o patrimônio não encolhe (na média).')}</span><span class="val">${fR(L.patrimonio*taxaPerpetua/12)}<small class="muted" style="font-size:12px"> /mês</small></span><span class="sub muted">${fP(taxaPerpetua,2)} ao ano: termina o prazo com o mesmo poder de compra do início</span></div>
    <div class="kpi"><span class="lab">Saque máximo para ${L.prazo} anos${info('O maior saque que faz o dinheiro durar exatamente o prazo: no último mês o patrimônio chega a zero. Acima disso, acaba antes.')}</span><span class="val">${fR(L.patrimonio*taxaPrazo/12)}<small class="muted" style="font-size:12px"> /mês</small></span><span class="sub muted">${fP(taxaPrazo,2)} ao ano: zera exatamente no fim do prazo</span></div>
   </section>
   <section class="card"><div class="card-h"><h2>Patrimônio ao longo do tempo</h2><span class="note">com retorno e inflação constantes</span></div>
    <div class="card-b"><div class="chart-box"><canvas id="ch-lib" aria-label="Patrimônio ao longo dos anos"></canvas></div>
    <div class="legend" style="margin-top:10px"><span><i style="background:var(--s1)"></i>Patrimônio em reais de hoje (poder de compra)</span><span><i style="background:var(--s4)"></i>Patrimônio inicial</span></div>
    <p class="note" style="margin:8px 0 0">O gráfico desconta a inflação para mostrar o que o dinheiro compra. O valor nominal, o que aparece no extrato, está na tabela.</p>
    <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th class="l">Ano</th><th>Saque por mês (nominal)</th><th>Patrimônio (nominal)</th><th>Patrimônio em reais de hoje</th></tr></thead><tbody>
     ${R.pts.filter(p=>p.ano%5===0||p.ano===1).map(p=>`<tr style="cursor:default"><td class="l">${p.ano}</td><td>${fR(p.saque)}</td><td>${fB(p.nom)}</td><td class="${p.real>=L.patrimonio?'up':'down'}">${fB(p.real)}</td></tr>`).join('')}
    </tbody></table></div></div></section>
   ${hist.length?`<section class="card"><div class="card-h"><h2>E se fosse na vida real?</h2><span class="note">mesma regra com o Ibovespa, o CDI e o IPCA de verdade, começando em cada janeiro desde 2001</span></div>
    <div class="card-b"><p class="note" style="margin:0 0 10px">Na média tudo parece estável, mas na vida real os anos ruins chegam em sequência. Quem começou a sacar logo antes de uma crise sofre mais. Aqui a mesma carteira e o mesmo saque passam pelos anos que de fato aconteceram${comp.length?`. Dos ${comp.length} começos que já completaram ${L.prazo} anos, ${ok_.length} chegaram ao fim sem zerar`:''}. ${acima} de ${hist.length} começos terminam (hoje ou no fim do prazo) com mais poder de compra que no início.</p>

     ${hist.map(h=>{ const w=Math.max(0,Math.min(200,h.finalReal*100)); return `<tr style="cursor:default"><td class="l">${h.ini}</td><td>${fN(h.anos,h.anos%1?1:0)}${h.completo?'':' <span class="muted">(até hoje)</span>'}</td>
      <td class="l"><span class="libbar"><i style="width:${w/2}%;background:${h.acabou!=null?'var(--down)':h.finalReal>=1?'var(--up)':'var(--accent)'}"></i></span><b class="${h.acabou!=null?'down':h.finalReal>=1?'up':''}">${h.acabou!=null?`zerou em ${fN(h.acabou/12,1)} anos`:fP(h.finalReal,0)}</b></td>
      <td class="${h.minReal<0.7?'down':''}">${fP(h.minReal,0)}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="note" style="margin:10px 0 0">O Ibovespa já inclui os dividendos reinvestidos. Não há custos de corretagem nem taxa de administração. "Pior momento" é o menor poder de compra que o patrimônio teve no caminho: abaixo de 70%, o susto foi grande. Os dados de CDI e IPCA começam em 2000, então os testes mais longos têm quase 26 anos.</p></div></section>`:''}
   <p class="note">Simulação de estudo, não é recomendação. Retorno passado não garante o futuro. A conta não considera mudanças de regra de imposto, custos com assessoria nem gastos extras ao longo da vida.</p></div>`;
  if(window.Chart&&$('#ch-lib')){
    const o=chartOpts(v=>fB(v)); o.plugins.tooltip.callbacks.title=i=>'Ano '+i[0].label; o.scales.x.ticks.callback=function(v){ return this.getLabelForValue(v); }; o.scales.y.beginAtZero=true;
    S.charts.lib=new Chart($('#ch-lib'),{type:'line',data:{labels:labs,datasets:[
      {label:'Em reais de hoje',data:R.pts.map(p=>p.real),borderColor:css('--s1'),borderWidth:2.2,pointRadius:0,tension:.1,fill:'start',backgroundColor:css('--accent-soft')},
      {label:'Patrimônio inicial',data:R.pts.map(()=>L.patrimonio),borderColor:css('--s4'),borderWidth:1.2,borderDash:[5,4],pointRadius:0}]},options:o}); }
}

async function cwCalcula(){

  if(!S.rank){ try{ S.rank=await getJSON('data/ranking.json'); }catch{} }
  const ibov=cwMediaIbov(+base);
  for(const it of M.itens){
    const x={it,tipo:it.tipo};
    if(it.tipo==='acao'){
      const r=byTk(it.tk); x.r=r; x.nome=it.tk; x.moeda=curRow(r); x.setor=(r&&r.setor)||'—';
      const usd=x.moeda==='USD', fxHoje=usd?cwUsd():1, fxCompra=usd?(cwUsd(it.data)||fxHoje):1;
      x.preco=r&&ok(r.preco)?r.preco:null;
      x.investido=it.qtd*it.pm*fxCompra; x.atual=x.preco!=null?it.qtd*x.preco*fxHoje:x.investido;
      x.semPreco=x.preco==null;

      x.prov=0; x.provEst=false;

      // dividend yield de 12 meses (o mesmo do painel: Yahoo, ou o declarado à CVM quando o Yahoo tem buraco)
      { const dy=r?dyDe(r):null; x.prov12=ok(dy)&&x.preco!=null?dy*x.preco*it.qtd*fxHoje:null; }
      const rk=S.rank&&S.rank.dados&&S.rank.dados[it.tk]; const m=rk&&rk[base];
      x.taxa=m&&ok(m.cagr_total)&&m.preco_completo?m.cagr_total:ibov; x.taxaFonte=m&&ok(m.cagr_total)&&m.preco_completo?`média de ${base} anos da ação`:'média do Ibovespa (ação sem histórico completo)';
      x.score=sgDe(it.tk);
    } else if(it.tipo==='rf'){
      x.nome=it.nome; x.setor='Renda fixa'; x.investido=it.investido; x.atual=it.atual; x.prov=0; x.prov12=null; x.taxa=it.taxa/100; x.taxaFonte='taxa informada';
    } else {
      x.nome=it.nome; x.setor='Outros'; x.investido=it.qtd*it.pm; x.atual=it.qtd*it.preco; x.prov=0; x.prov12=null; x.taxa=it.taxa/100; x.taxaFonte='taxa informada';
    }

}
function cwProjeta(P,anos,aporte,taxaFixa){
  const meses=anos*12, vals=P.map(x=>x.atual), tot0=vals.reduce((a,b)=>a+b,0)||1, pesos=P.map(x=>x.atual/tot0);

// ===================== opções: calculadora Black-Scholes =====================
// Papéis com opções negociadas na B3. 'alta' = séries mensais com bastante negócio; 'media' = negocia, mas confira o volume no home broker.
const OP_LISTA=[['PETR4','alta'],['VALE3','alta'],['BOVA11','alta'],['ITUB4','alta'],['BBDC4','alta'],['BBAS3','alta'],['B3SA3','alta'],['PRIO3','alta'],['ABEV3','alta'],
  ['MGLU3','media'],['GGBR4','media'],['SUZB3','media'],['WEGE3','media'],['ITSA4','media'],['USIM5','media'],['CMIG4','media'],['CSNA3','media'],['ELET3','media'],['BBSE3','media'],
  ['RENT3','media'],['LREN3','media'],['EQTL3','media'],['VIVT3','media'],['RADL3','media'],['HAPV3','media'],['CSAN3','media'],['KLBN11','media'],['SBSP3','media'],['TIMS3','media'],
  ['RAIL3','media'],['COGN3','media'],['GOAU4','media'],['EMBR3','media'],['BRAP4','media'],['PETR3','media']];
const OP_LIQ=Object.fromEntries(OP_LISTA);
S.op={tk:'PETR4',tipo:'call',K:null,venc:null,vol:null,volAuto:true,taxa:null,qtd:100,mkt:'',ideias:null};
// distribuição normal acumulada (erro < 1e-7)
function opN(x){ const t=1/(1+0.2316419*Math.abs(x)), d=0.3989422804014327*Math.exp(-x*x/2);
  const p=d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429)))); return x>0?1-p:p; }
function opBS(S0,K,T,r,s,tipo){
  if(!(S0>0&&K>0&&T>0&&s>0)) return null;
  const d1=(Math.log(S0/K)+(r+s*s/2)*T)/(s*Math.sqrt(T)), d2=d1-s*Math.sqrt(T);
  if(tipo==='call') return {p:S0*opN(d1)-K*Math.exp(-r*T)*opN(d2),delta:opN(d1),prob:opN(d2)};
  return {p:K*Math.exp(-r*T)*opN(-d2)-S0*opN(-d1),delta:opN(d1)-1,prob:opN(-d2)};
}
function opIV(preco,S0,K,T,r,tipo){ let lo=0.01,hi=4; const f=s=>opBS(S0,K,T,r,s,tipo).p-preco;
  if(!(preco>0)||f(lo)>0||f(hi)<0) return null; for(let i=0;i<80;i++){ const m=(lo+hi)/2; if(f(m)>0) hi=m; else lo=m; } return (lo+hi)/2; }
// vencimentos mensais da B3: terceira sexta-feira do mês
function opTerceiraSexta(a,m){ const d=new Date(a,m,1); const add=(5-d.getDay()+7)%7; return new Date(a,m,1+add+14); }
function opVencs(n=4){ const hoje=new Date(); hoje.setHours(0,0,0,0); const out=[]; let a=hoje.getFullYear(), m=hoje.getMonth();
  while(out.length<n){ const v=opTerceiraSexta(a,m); if(v>hoje) out.push(v); m++; if(m>11){ m=0; a++; } } return out; }
const opISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const opBR=iso=>iso.split('-').reverse().join('/');
function opDU(iso){ const fim=new Date(iso+'T00:00:00'), d=new Date(); d.setHours(0,0,0,0); let n=0;
  while(d<fim){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w&&w<6) n++; } return n; }   // dias úteis (sem contar feriados)
function opCDI(){ const c=S.macro&&S.macro.cdi; if(!c) return null; const atual=new Date().toISOString().slice(0,7);
  const ks=Object.keys(c).sort().filter(k=>k<atual).slice(-3); if(!ks.length) return null;
  const f=ks.reduce((a,k)=>a*(1+c[k]/100),1); return Math.pow(f,12/ks.length)-1; }
function opSerie(t){ const x=S.dia[t]; return x&&x.d&&x.d.c&&x.d.c.length>30?x.d:null; }
function opVol(t,n){ const d=opSerie(t); if(!d) return null; const c=d.c.slice(-(n+1)).filter(v=>v>0); if(c.length<15) return null;
  const r=[]; for(let i=1;i<c.length;i++) r.push(Math.log(c[i]/c[i-1])); const mu=r.reduce((a,b)=>a+b,0)/r.length;
  return Math.sqrt(r.reduce((a,b)=>a+(b-mu)**2,0)/(r.length-1)*252); }
function opPreco(t){ const d=opSerie(t); return d?{p:d.c.at(-1),dt:d.t.at(-1)}:null; }
// leitura do score, a partir do backtest de 5 anos (veja o quadro no fim da aba)
function opLeitura(t,tipo){
  const x=sgDe(t); if(!x||!x.f||!x.t) return {txt:'Sem score',cls:'',por:'Esta ação não tem nota no painel. A calculadora funciona, mas sem a leitura do score.'};
  const f=x.f.score, tc=x.t.score;
  if(tipo==='put'){
    if(f<40) return {txt:'Evite',cls:'ruim',por:`Fundamentos fracos (nota ${f}). No teste de 5 anos, vender put em ações com nota fundamentalista abaixo de 40 perdeu cerca de 1% ao mês: a ação caiu e a put foi exercida.`};
    if(tc<40) return {txt:'Cuidado',cls:'aviso',por:`Gráfico em queda (nota técnica ${tc}). No teste, vender put com técnica abaixo de 40 deu prejuízo médio: a chance de exercício subiu para 36%.`};
    if(f>=55) return {txt:'Favorável',cls:'bom',por:`Empresa boa (fundamentos ${f}) e gráfico sem queda forte (técnica ${tc}). No teste, esse grupo foi o que mais rendeu vendendo put: se for exercido, você compra uma ação que já queria ter.`};
    return {txt:'Neutro',cls:'',por:`Fundamentos medianos (${f}) e técnica ${tc}. No teste, esse grupo ficou perto do zero a zero além do CDI.`};
  }
  if(tc>=65) return {txt:'Cuidado',cls:'aviso',por:`Gráfico forte (nota técnica ${tc}). No teste, essas ações subiram em média 1,8% ao mês: a call foi exercida mais vezes e você perde a alta. Venda coberta rendeu menos que só segurar a ação.`};
  if(tc<40) return {txt:'Neutro',cls:'',por:`Gráfico fraco (nota técnica ${tc}). No teste, vender call nesse grupo deu resultado misto: ganhou um pouco em alguns períodos e perdeu em outros, porque são ações que às vezes dão repiques fortes.`};
  return {txt:'Favorável',cls:'bom',por:`Gráfico neutro (nota técnica ${tc}): a ação tende a andar de lado. No teste, foi o melhor momento para venda coberta.`};
}
function opDefaults(){
  const O=S.op, pr=opPreco(O.tk); if(!pr) return;
  if(!O.venc){ const vs=opVencs(4); O.venc=opISO(opDU(opISO(vs[0]))>=10?vs[0]:vs[1]); }
  if(O.volAuto||!ok(O.vol)){ const v=opVol(O.tk,63); if(ok(v)) O.vol=+(v*100).toFixed(1); }
  if(!ok(O.taxa)){ const c=opCDI(); O.taxa=ok(c)?+(c*100).toFixed(2):14; }
  if(!ok(O.K)) O.K=opArred(pr.p*(O.tipo==='call'?1.08:0.95));
}
const opArred=v=>v>=50?Math.round(v):v>=10?Math.round(v*4)/4:Math.round(v*20)/20;   // strikes da B3 andam de degrau em degrau
function opCalc(t,tipo,K,venc,volPct,taxaPct){
  const pr=opPreco(t); if(!pr||!ok(K)||!venc) return null;
  const du=opDU(venc), T=du/252, r=Math.log(1+taxaPct/100), s=volPct/100, b=opBS(pr.p,K,T,r,s,tipo); if(!b) return null;
  const base=tipo==='call'?pr.p:K, ret=b.p/base, meses=du/21, cdiPer=Math.pow(1+taxaPct/100,T)-1;
  return {...b,S0:pr.p,dt:pr.dt,K,du,T,r,s,ret,retMes:Math.pow(1+ret,1/Math.max(meses,0.05))-1,cdiPer,dist:K/pr.p-1};
}

  box.innerHTML=`<div style="display:grid;gap:18px">
   <section class="kpis">
    <div class="kpi"><span class="lab">Prêmio ${fonte}${info('Quanto você recebe na hora por ação vendendo a opção. Multiplique pela quantidade para ver o total.')}</span><span class="val">${fR(premio)}<small class="muted" style="font-size:12px"> /ação</small></span><span class="sub muted">${fR(premio*q)} no total (${fN(q,0)} ações)${ok(mkt)&&mkt>0?` · teoria: ${fR(c.p)}`:''}</span></div>
    <div class="kpi"><span class="lab">Rende no período${info(call?'Prêmio dividido pelo preço da ação hoje: é o que a venda coberta acrescenta ao que a ação já rende.':'Prêmio dividido pelo strike (o dinheiro reservado). Esse dinheiro continua rendendo CDI enquanto isso, então o total é prêmio + CDI.')}</span><span class="val">${fP(ret,2)}</span><span class="sub muted">≈ ${fP(retMes,2)} ao mês · ${call?`CDI no período: ${fP(c.cdiPer,2)}`:`mais o CDI: ${fP(c.cdiPer,2)} → total ${fP(ret+c.cdiPer,2)}`}</span></div>
    <div class="kpi"><span class="lab">Chance de ser exercido${info('Estimativa pela própria fórmula (probabilidade de a ação terminar além do strike no vencimento). É aproximada: vale como ordem de grandeza.\n\nDelta: quanto a opção muda de preço para cada R$ 1 da ação.')}</span><span class="val ${c.prob>0.4?'down':c.prob<0.2?'up':''}">${fP(c.prob,0)}</span><span class="sub muted">delta ${fN(c.delta,2)} · strike ${fP(c.dist,1,true)} do preço</span></div>
    <div class="kpi"><span class="lab">${call?'Se for exercido':'Se for exercido'}${info(call?'Você vende a ação pelo strike e fica com o prêmio. O número é o ganho total sobre o preço de hoje, sem contar dividendos.':'Você compra a ação pelo strike, mas o prêmio já recebido baixa o custo. O número compara esse custo com o preço de hoje.')}</span><span class="val ${call?'up':''}">${call?fP(exercido,2,true):fR(c.K-premio)}</span><span class="sub muted">${call?`vende a ${fR(c.K)} + prêmio`:`custo por ação · ${fP(exercido,1,true)} vs. o preço de hoje`}</span></div>
    ${call?`<div class="kpi"><span class="lab">Proteção na queda${info('O prêmio compensa uma queda da ação até este preço. Abaixo dele, você perde (como perderia sem a opção, só que um pouco menos).')}</span><span class="val">${fR(prot)}</span><span class="sub muted">${fP(prot/c.S0-1,1,true)} do preço de hoje</span></div>`
     :`<div class="kpi"><span class="lab">Dinheiro reservado${info('Quanto precisa ficar parado na conta (de preferência rendendo CDI, em Tesouro Selic ou fundo DI aceito como garantia) para comprar as ações se a put for exercida.')}</span><span class="val">${fR(c.K*q)}</span><span class="sub muted">strike × ${fN(q,0)} ações · rende ${fR(c.K*q*c.cdiPer)} de CDI até o vencimento</span></div>`}
    ${iv!=null?`<div class="kpi"><span class="lab">Volatilidade que o mercado cobra${info('A volatilidade que faz a fórmula chegar ao preço que você digitou. Se estiver bem acima da volatilidade histórica, a opção está "cara": bom para quem vende.')}</span><span class="val ${iv>c.s*1.05?'up':iv<c.s*0.95?'down':''}">${fP(iv,1)}</span><span class="sub muted">${iv>c.s*1.05?`acima da usada (${fP(c.s,1)}): prêmio caro, bom para quem vende`:iv<c.s*0.95?`abaixo da usada (${fP(c.s,1)}): prêmio barato, pense duas vezes`:`perto da usada (${fP(c.s,1)}): prêmio próximo da teoria`}</span></div>`:''}
   </section>
   <section class="card"><div class="card-h"><h2>Leitura do score · <span class="sglado ${L.cls}" style="font-size:15px">${esc(L.txt)}</span></h2>${x&&x.f&&x.t?`<span class="note">fundamentos ${x.f.score} · técnica ${x.t.score} · total ${x.total}</span>`:''}</div>
    <div class="card-b"><p style="margin:0">${esc(L.por)}</p></div></section>
   <section class="card"><div class="card-h"><h2>Resultado no vencimento</h2><span class="note">${fN(q,0)} ações · prêmio ${fonte}</span></div>
    <div class="card-b"><div class="chart-box"><canvas id="ch-op" aria-label="Resultado no vencimento conforme o preço da ação"></canvas></div>
    <div class="legend" style="margin-top:10px"><span><i style="background:var(--s1)"></i>${call?'Com a venda coberta':'Vendendo a put (prêmio + CDI)'}</span><span><i style="background:var(--s4)"></i>${call?'Só segurando a ação':'Comprando a ação hoje'}</span>${call?'':'<span><i style="background:var(--s3)"></i>Só o CDI</span>'}</div>
    <p class="note" style="margin:8px 0 0">${call?'Acima do strike a linha fica reta: você vende pelo strike e não ganha a alta extra. Abaixo, o prêmio amortece a queda.':'Acima do strike você fica com o prêmio e o CDI. Abaixo, compra a ação pelo strike e o prejuízo começa depois do ponto de equilíbrio.'} Não inclui dividendos, custos nem imposto.</p></div></section></div>`;
  if(window.Chart&&$('#ch-op')){
    const xs=[], ys=[], alt=[], cdi=[]; for(let i=0;i<=60;i++){ const st=c.S0*(0.75+i*0.5/60); xs.push(st);
      if(call){ ys.push(q*(Math.min(st,c.K)-c.S0+premio)); alt.push(q*(st-c.S0)); }
      else { ys.push(q*(premio-Math.max(c.K-st,0)+c.K*c.cdiPer)); alt.push(q*(st-c.S0)); cdi.push(q*c.K*c.cdiPer); } }
    const o=chartOpts(v=>fR(v)); o.plugins.tooltip.callbacks.title=i=>'Ação no vencimento: '+fR(xs[i[0].dataIndex]);
    o.scales.x.ticks.callback=function(v){ return fR(xs[v]).replace(/,\d+$/,''); }; o.scales.x.ticks.maxRotation=0; o.scales.x.ticks.autoSkip=true; o.scales.x.ticks.maxTicksLimit=innerWidth<600?5:9;
    const ds=[{label:call?'Com a venda coberta':'Vendendo a put',data:ys,borderColor:css('--s1'),borderWidth:2.4,pointRadius:0},
      {label:call?'Só a ação':'Comprando a ação hoje',data:alt,borderColor:css('--s4'),borderWidth:1.4,borderDash:[5,4],pointRadius:0}];
    if(!call) ds.push({label:'Só o CDI',data:cdi,borderColor:css('--s3'),borderWidth:1.2,borderDash:[2,3],pointRadius:0});
    S.charts.op=new Chart($('#ch-op'),{type:'line',data:{labels:xs.map((_,i)=>i),datasets:ds},options:o});
  }
}
async function opIdeias(){
  const lst=OP_LISTA.map(([t])=>t); await Promise.all(lst.map(t=>loadDia(t)));
  const vs=opVencs(4), venc=opISO(opDU(opISO(vs[0]))>=10?vs[0]:vs[1]), taxa=(opCDI()??0.14)*100, out=[];
  for(const t of lst){ const pr=opPreco(t), v=opVol(t,63); if(!pr||!ok(v)) continue;
    const c=opCalc(t,'call',opArred(pr.p*1.08),venc,v*100,taxa), p=opCalc(t,'put',opArred(pr.p*0.95),venc,v*100,taxa);
    out.push({t,pr:pr.p,v,c,p,lc:opLeitura(t,'call'),lp:opLeitura(t,'put'),x:sgDe(t)}); }
  S.op.ideias={venc,lin:out}; opDesenhaIdeias();
}
function opDesenhaIdeias(){
  const box=$('#op-ideias'), I=S.op.ideias; if(!box||!I||I==='carregando') return;
  const sub=$('#op-ideias-sub'); if(sub) sub.textContent=`vencimento ${opBR(I.venc)} · ${opDU(I.venc)} dias úteis · volatilidade de 3 meses`;
  const ord={bom:0,'':1,aviso:2,ruim:3}, lin=[...I.lin].sort((a,b)=>(ord[a.lp.cls]-ord[b.lp.cls])||(b.p.retMes-a.p.retMes));
  const sel=t=>t===S.op.tk?' style="background:var(--accent-soft)"':'';
  box.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th class="l">Ação</th><th>Preço</th><th>Vol. 3m</th><th class="l">Opções${info('Alta: séries mensais com muito negócio. Média: negocia, mas confira o volume do strike no home broker antes de vender.')}</th><th>Score F / T</th>
    <th>CALL +8%<br><small class="muted">prêmio/mês</small></th><th class="l">Leitura call</th><th>PUT −5%<br><small class="muted">prêmio/mês</small></th><th class="l">Leitura put</th></tr></thead><tbody>
    ${lin.map(r=>`<tr data-optk="${r.t}"${sel(r.t)}><td class="l"><span class="tk">${r.t}</span></td><td>${fR(r.pr)}</td><td>${fP(r.v,0)}</td><td class="l">${OP_LIQ[r.t]==='alta'?'<span class="sglado bom">Alta</span>':'<span class="sglado">Média</span>'}</td>
      <td>${r.x&&r.x.f&&r.x.t?`${r.x.f.score} / ${r.x.t.score}`:'—'}</td><td>${fP(r.c.retMes,2)}</td><td class="l"><span class="sglado ${r.lc.cls}" title="${esc(r.lc.por)}">${esc(r.lc.txt)}</span></td>
      <td>${fP(r.p.retMes,2)}</td><td class="l"><span class="sglado ${r.lp.cls}" title="${esc(r.lp.por)}">${esc(r.lp.txt)}</span></td></tr>`).join('')}
   </tbody></table></div>
   <p class="note" style="margin:10px 0 0">Ordenado pela leitura da put e depois pelo prêmio. "Prêmio/mês" é o prêmio teórico dividido pelo preço (call) ou pelo strike (put), convertido para um mês; na put, o CDI vem por cima. Prêmio alto quase sempre significa ação mais arriscada, não oportunidade.</p>`;
}
document.addEventListener('click',e=>{
  if(S.tab!=='opcoes') return;
  const db=e.target.closest('[data-opdist]'); if(db){ opLe(); const pr=opPreco(S.op.tk); if(pr){ S.op.K=opArred(pr.p*(1+(+db.dataset.opdist))); opDesenha(); } return; }
  const tr=e.target.closest('[data-optk]'); if(tr&&!e.target.closest('.info')){ const t=tr.dataset.optk; opTroca(t); window.scrollTo({top:0,behavior:'smooth'}); }
});
function opLe(){ const O=S.op, g=id=>document.getElementById(id); if(!g('op-k')) return;
  O.tipo=g('op-tipo').value; O.venc=g('op-venc').value; O.K=num(g('op-k').value);
  const v=num(g('op-vol').value); if(ok(v)&&Math.abs(v-O.vol)>0.04){ O.vol=v; O.volAuto=false; }
  const tx=num(g('op-taxa').value); if(ok(tx)) O.taxa=tx;
  O.qtd=Math.max(1,Math.round(num(g('op-qtd').value)||100)); O.mkt=g('op-mkt').value.trim(); }
async function opTroca(t){ const O=S.op; t=String(t||'').trim().toUpperCase(); if(!t||t===O.tk&&opPreco(t)) return;
  O.tk=t; O.K=null; O.mkt=''; O.volAuto=true; await loadDia(t); opDefaults(); opDesenha(); if(O.ideias&&O.ideias!=='carregando') opDesenhaIdeias(); }
document.addEventListener('change',e=>{
  const el=e.target; if(!/^op-/.test(el.id)) return;
  if(el.id==='op-tk'){ opTroca(el.value); return; }
  const tipoAnt=S.op.tipo; opLe();
  if(el.id==='op-tipo'&&S.op.tipo!==tipoAnt){ S.op.K=null; S.op.mkt=''; opDefaults(); }
  opDesenha();
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.closest&&e.target.closest('.op-form')){ e.preventDefault(); e.target.blur(); } });

// ===================== verificação automática dos dados =====================
const QNIVEL={erro:['Provável erro','ruim'],atencao:['Atenção','aviso'],info:['Aviso','']};
function qualDe(t){ return S.qual&&S.qual.alertas?S.qual.alertas.filter(a=>a.ticker===t):[]; }
function mostraQual(){
  const b=$('#qbtn'); if(!b||!S.qual) return; const r=S.qual.resumo||{}, n=(r.erro||0)+(r.atencao||0);
  b.hidden=false; b.className='qbtn '+(r.erro?'ruim':n?'aviso':'bom');
  b.textContent=r.erro?`⚠ ${r.erro} erro(s)`:n?`⚠ ${n} alerta(s)`:'✓ verificado'; b.title='Verificação automática dos dados: clique para ver';
}
function qualFicha(r){
  const al=qualDe(r.ticker).filter(a=>!(a.campo==='preco'&&a.nivel==='info'));
  if(!al.length) return '';
  return `<div class="banner qban">${al.map(a=>`<div><b class="sglado ${QNIVEL[a.nivel][1]}">${QNIVEL[a.nivel][0]}:</b> ${esc(a.msg)}</div>`).join('')}
    <div class="muted" style="font-size:11.5px;margin-top:4px">Verificação automática feita pelo robô a cada atualização. Os números marcados podem estar errados; confira no site de RI da empresa.</div></div>`;
}
function vQual(){
  const Q=S.qual; if(!Q) return '';
  const grupos=['erro','atencao','info'].map(nv=>{ const al=Q.alertas.filter(a=>a.nivel===nv); if(!al.length) return '';
    return `<h3 class="sgh">${QNIVEL[nv][0]} · ${al.length}</h3><div class="tbl-wrap"><table><tbody>${al.map(a=>`<tr data-open="${esc(a.ticker)}"><td class="l" style="width:90px"><span class="tk">${esc(a.ticker)}</span></td><td class="l" style="white-space:normal;font-family:var(--f-body)">${esc(a.msg)}</td></tr>`).join('')}</tbody></table></div>`; }).join('');
  return `<section class="card" id="qual-card"><div class="card-h"><h2>Verificação automática dos dados</h2><button class="btn" data-qual="fechar">Fechar</button></div>
   <div class="card-b"><p class="note" style="margin:0 0 6px">A cada atualização o robô confere ${Q.empresas_b3} empresas da B3 e as ações dos EUA: números impossíveis (lucro zerado com receita, patrimônio vazio), muito fora do normal (P/L, P/VP, dividend yield), mudanças bruscas em relação à véspera e saltos no histórico de preço. Se a rodada vier muito pior que a anterior, ele não grava nada e o site fica com os dados da véspera.</p>${grupos||'<p>Nenhum alerta.</p>'}</div></section>`;
}

// ===================== tema claro / escuro =====================
const TEMAS=['sistema','claro','escuro'];
const ICONE={sistema:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  claro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  escuro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'};
function aplicaTema(t,redesenha){
  const r=document.documentElement;
  if(t==='claro') r.setAttribute('data-theme','light'); else if(t==='escuro') r.setAttribute('data-theme','dark'); else r.removeAttribute('data-theme');
  const b=document.getElementById('tema'); if(b) b.innerHTML=ICONE[t]+'<span>'+({sistema:'Sistema',claro:'Claro',escuro:'Escuro'})[t]+'</span>';
  try{ localStorage.setItem('painel-tema',t); }catch{}
  if(redesenha&&S.rows.length) render();   // gráficos pegam as cores do tema na hora de desenhar
}
S.mc=cwCarrega();
try{ const t=localStorage.getItem('painel-tf'); if(['m','w','d'].includes(t)) S.tf=t; }catch{}
try{ const g=localStorage.getItem('painel-graf'); if(g==='candle'||g==='linha') S.graf=g; }catch{}
let temaAtual='sistema'; try{ temaAtual=localStorage.getItem('painel-tema')||'sistema'; }catch{}
if(!TEMAS.includes(temaAtual)) temaAtual='sistema';
aplicaTema(temaAtual,false);
document.getElementById('tema').addEventListener('click',()=>{ temaAtual=TEMAS[(TEMAS.indexOf(temaAtual)+1)%3]; aplicaTema(temaAtual,true); });
try{ matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{ if(temaAtual==='sistema'&&S.rows.length) render(); }); }catch{}

// ===================== início =====================
(async function(){
  try{
    const [rows,meta]=await Promise.all([getJSON('data/indicadores.json'),getJSON('data/meta.json').catch(()=>({}))]);
    S.rows=rows; S.meta=meta;
    if(!rows.some(r=>ok(r.preco))) S.f.soPreco=false;
    if((meta.com_preco||0)<50) S.f.soPreco=false;
    $('#stamp').textContent=meta.atualizado_em?`Atualizado em ${meta.atualizado_em.split(' ')[0].split('-').reverse().join('/')} · ${meta.acoes} ações`:'';
  }catch(e){ $('#app').innerHTML='<div class="card"><div class="empty">Não consegui carregar os dados ('+esc(e.message)+').</div></div>'; return; }
  getJSON('data/qualidade.json').then(q=>{ S.qual=q; mostraQual(); if(S.tab==='acao') render(); }).catch(()=>{});
  getJSON('data/macro.json').then(m=>{ S.macro=m; if(['simulador','liberdade','carteira'].includes(S.tab)) render(); }).catch(()=>{});
  const h=(location.hash||'').slice(1).toUpperCase();
  if(h && byTk(h)){ S.tk=h; setTab('acao'); } else setTab('buscador');
})();
</script>
