<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirante · mercado segurador</title>
<meta name="description" content="Comparativo do mercado segurador brasileiro com dados públicos da SUSEP, atualizado automaticamente.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface2:#F5F8FB; --ink:#102A43; --ink2:#334E68; --muted:#627D98; --line:#D9E2EC; --line2:#BCCCDC;
  --brand:#1747E5; --brand-soft:rgba(23,71,229,.08); --focus:#F5A300; --focus-ink:#3D2600; --focus-soft:rgba(245,163,0,.14);
  --up:#0E7C55; --down:#C23B32;
  --r1:#1747E5; --r2:#3D66F0; --r3:#6687F5; --r4:#8EA7F8; --r5:#B5C6FB; --r6:#D4DEFC; --rest:#CBD5E1;
  --f-disp:'Bricolage Grotesque',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(16,42,67,.05),0 8px 24px -12px rgba(16,42,67,.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1524; --surface:#111E31; --surface2:#16253B; --ink:#E7EEF6; --ink2:#BCCCDC; --muted:#8AA1B8; --line:#22344D; --line2:#2F4562;
  --brand:#6F8DFF; --brand-soft:rgba(111,141,255,.12); --focus:#FFB627; --focus-ink:#2B1A00; --focus-soft:rgba(255,182,39,.16);
  --up:#3DC48F; --down:#FF7A70;
  --r1:#6F8DFF; --r2:#5876E6; --r3:#4661C7; --r4:#394FA3; --r5:#2E4080; --r6:#263565; --rest:#2A3A52;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1524; --surface:#111E31; --surface2:#16253B; --ink:#E7EEF6; --ink2:#BCCCDC; --muted:#8AA1B8; --line:#22344D; --line2:#2F4562;
  --brand:#6F8DFF; --brand-soft:rgba(111,141,255,.12); --focus:#FFB627; --focus-ink:#2B1A00; --focus-soft:rgba(255,182,39,.16);
  --up:#3DC48F; --down:#FF7A70;
  --r1:#6F8DFF; --r2:#5876E6; --r3:#4661C7; --r4:#394FA3; --r5:#2E4080; --r6:#263565; --rest:#2A3A52;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--brand)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
@media (max-width:640px){.wrap{padding:0 16px}}

/* topo */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:22px;height:64px}
.marca{display:flex;align-items:center;gap:10px;font:800 21px/1 var(--f-disp);letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.marca svg{width:28px;height:28px}
.marca small{font:500 12px/1.2 var(--f-body);color:var(--muted);letter-spacing:0;display:block;margin-top:2px}
nav.abas{display:flex;gap:2px;margin-left:8px}
nav.abas button{border:0;background:none;padding:8px 13px;border-radius:999px;color:var(--ink2);cursor:pointer;font-weight:500}
nav.abas button:hover{background:var(--surface)}
nav.abas button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.top-dir{margin-left:auto;display:flex;align-items:center;gap:10px}
.foco-sel{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px}
.foco-sel .pin{width:10px;height:10px;border-radius:50%;background:var(--focus);box-shadow:0 0 0 3px var(--focus-soft)}
.foco-sel label{font-size:12.5px;color:var(--muted)}
.foco-sel select{border:0;background:transparent;font-weight:600;max-width:190px;padding:4px 2px;cursor:pointer}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.ib svg{width:17px;height:17px}
@media (max-width:980px){header.top{position:static}.top-in{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px}nav.abas{order:3;width:100%;overflow-x:auto;margin:0}nav.abas button{white-space:nowrap}}

/* filtros */
.filtros{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:18px 0 6px}
.linhas{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.chip:hover{border-color:var(--line2)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.sep{width:1px;height:22px;background:var(--line)}
.ctrl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ctrl select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:500;color:var(--ink)}
.subramos{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 10px}
.subramos .chip{font-size:12.5px;padding:4px 10px}
.subramos .chip[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,transparent)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* abertura */
.abertura{padding:22px 0 8px}
.abertura h1{font:650 clamp(30px,4.4vw,52px)/1.04 var(--f-disp);letter-spacing:-.035em;margin:0;max-width:18ch;text-wrap:balance}
.abertura .sub{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;color:var(--ink2);font-size:15.5px}
.abertura .sub b{font-weight:600;color:var(--ink)}
.pos{color:var(--up)} .neg{color:var(--down)}

/* faixa de participação */
.faixa-box{margin:26px 0 8px}
.faixa{display:flex;height:64px;border-radius:14px;overflow:hidden;background:var(--rest);box-shadow:var(--shadow)}
.faixa .s{position:relative;min-width:2px;border-right:2px solid var(--bg);display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 8px 10px;color:#fff;cursor:pointer;transition:filter .15s}
.faixa .s:last-child{border-right:0}
.faixa .s:hover{filter:brightness(1.08)}
.faixa .s b{font:650 15px/1.1 var(--f-disp);white-space:nowrap;overflow:hidden;text-overflow:clip}
.faixa .s small{font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden}
.faixa .s.claro{color:var(--ink)}
.faixa .s.foco{background:var(--focus)!important;color:var(--focus-ink)}
.faixa-reg{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--muted)}
.faixa-reg .foco-m{color:var(--ink);font-weight:500}
.faixa-reg .foco-m i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--focus);margin-right:6px}
@media (max-width:640px){.faixa{height:52px}.faixa .s b{font-size:13px}.faixa .s small{display:none}}
.faixa-anim .s{animation:cresce .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes cresce{from{flex-grow:0!important;opacity:.2}}
@media (prefers-reduced-motion:reduce){.faixa-anim .s{animation:none}}

/* painéis */
.grade{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:22px;margin:26px 0}
.grade2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin:0 0 26px}
@media (max-width:980px){.grade,.grade2{grid-template-columns:minmax(0,1fr)}}
.painel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0}
.painel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 22px 6px;flex-wrap:wrap}
.painel-h h2{font:650 19px/1.2 var(--f-disp);letter-spacing:-.015em;margin:0}
.painel-h p{margin:0;color:var(--muted);font-size:13px}
.painel-b{padding:10px 22px 20px}
.nota{color:var(--muted);font-size:12.5px}

/* tabela */
.tab-wrap{overflow-x:auto;margin:0 -8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface2)}
tr.foco td{background:var(--focus-soft)!important}
tr.foco td.nome{font-weight:600}
td.nome{max-width:200px;overflow:hidden;text-overflow:ellipsis}
td.pos-n{color:var(--muted);width:28px}
.barra{display:inline-block;height:6px;border-radius:3px;background:var(--brand);vertical-align:middle;margin-right:8px;opacity:.8}
tr.foco .barra{background:var(--focus)}
.mov{font-size:12px;margin-left:4px}

/* cartão de foco */
.foco-card .titulo{display:flex;align-items:center;gap:10px}
.foco-card .titulo .pin{width:12px;height:12px;border-radius:50%;background:var(--focus);box-shadow:0 0 0 4px var(--focus-soft)}
.posicao{font:800 64px/1 var(--f-disp);letter-spacing:-.04em;margin:6px 0 2px}
.posicao small{font:500 16px var(--f-body);color:var(--muted);letter-spacing:0;margin-left:6px}
.compara{display:grid;gap:14px;margin-top:16px}
.cmp .rot{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}
.cmp .rot b{color:var(--ink);font-weight:600}
.cmp .trilho{position:relative;height:8px;background:var(--surface2);border-radius:4px;margin-top:6px;border:1px solid var(--line)}
.cmp .trilho i{position:absolute;top:-1px;bottom:-1px;left:0;border-radius:4px;background:var(--focus)}
.cmp .trilho u{position:absolute;top:-5px;width:2px;height:16px;background:var(--ink);border-radius:1px}
.cmp .leg{font-size:12px;color:var(--muted);margin-top:4px}
.chart{position:relative;height:300px}
.chart.alto{height:340px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:22px 0;box-shadow:var(--shadow)}
.kpi{background:var(--surface);padding:16px 18px}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font:650 26px/1.15 var(--f-disp);letter-spacing:-.02em;margin-top:4px}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:2px}

/* notícias */
.nots{display:grid;gap:0}
.nt{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.nt:last-child{border-bottom:0}
.nt time{font-size:12.5px;color:var(--muted);padding-top:2px}
.nt a{color:var(--ink);text-decoration:none;font-weight:500}
.nt a:hover{color:var(--brand);text-decoration:underline}
.nt .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:12px;color:var(--muted);align-items:center}
.tag{border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:500;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.tag.Produto{background:rgba(23,71,229,.1);color:var(--brand);border-color:transparent}
.tag.Marketing{background:rgba(196,48,140,.1);color:#B0287D;border-color:transparent}
.tag.Resultado{background:rgba(14,124,85,.1);color:var(--up);border-color:transparent}
.tag.Parceria{background:rgba(120,80,220,.1);color:#6A47C9;border-color:transparent}
.tag.Aquisição{background:rgba(245,163,0,.16);color:#8A5A00;border-color:transparent}
.tag.Pessoas{background:rgba(98,125,152,.14);color:var(--ink2);border-color:transparent}
.tag.Regulação{background:rgba(194,59,50,.1);color:var(--down);border-color:transparent}
.tag.ins{background:var(--ink);color:var(--bg);border-color:transparent}
.vazio{padding:28px 0;color:var(--muted);text-align:center}

/* comparar */
.comp-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cc{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 6px 5px 12px;font-size:13.5px}
.cc i{width:10px;height:10px;border-radius:50%}
.cc button{border:0;background:var(--surface2);border-radius:50%;width:22px;height:22px;cursor:pointer;color:var(--muted);line-height:1}
.add-sel{border:1px dashed var(--line2);background:transparent;border-radius:999px;padding:6px 10px;color:var(--ink2)}

.como h3{font:650 17px var(--f-disp);margin:22px 0 6px}
.como p,.como li{color:var(--ink2);max-width:75ch}

/* cidade */
.cidade-top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px;padding:22px 0 14px}
.cidade-top h1{font:650 clamp(30px,4.4vw,52px)/1.04 var(--f-disp);letter-spacing:-.035em;margin:0;max-width:16ch}
.cidade-top p{margin:10px 0 0;color:var(--ink2);max-width:60ch}
.cena{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#071631 0%,#0E2A6B 48%,#2F55D4 82%,#7E97F2 100%);box-shadow:var(--shadow)}
.cena-rolo{overflow-x:auto;overflow-y:hidden}
.cena svg{display:block;width:100%;min-width:920px;height:auto}
.cena .predio{cursor:pointer;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.cena .predio:hover{transform:translateY(-6px)}
.cena .predio:focus-visible{outline:none}
.cena .predio:focus-visible .fachada{stroke:#fff;stroke-width:2}
.cena.escolhido .predio{opacity:.32}
.cena.escolhido .predio.ativo{opacity:1;transform:translateY(-22px)}
.cena .rot{fill:#DCE5FF;font:500 11px var(--f-body);text-anchor:middle;pointer-events:none}
.cena .rot.f{fill:#FFD27A;font-weight:600}
.cena-leg{position:absolute;left:20px;top:16px;color:#C9D6FF;font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap}
.cena-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.subir .predio{animation:sobe 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes sobe{from{transform:translateY(420px)}}
@media (prefers-reduced-motion:reduce){.subir .predio{animation:none}.cena .predio{transition:none}}
.ficha{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;margin:22px 0 26px}
@media (max-width:900px){.ficha{grid-template-columns:minmax(0,1fr)}}
.ficha-h{display:flex;align-items:center;gap:12px}
.ficha-h h2{font:700 30px/1.1 var(--f-disp);letter-spacing:-.025em;margin:0}
.ficha .grande{font:800 46px/1 var(--f-disp);letter-spacing:-.035em;margin:14px 0 4px}
.ficha .dados{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;margin-top:18px}
.ficha .dados div span{display:block;font-size:12.5px;color:var(--muted)}
.ficha .dados div b{font:650 20px/1.2 var(--f-disp)}
.mixl{display:grid;gap:9px}
.mixl .it{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;align-items:center;gap:10px;font-size:13.5px}
.mixl .it u{display:block;height:10px;border-radius:5px;background:var(--brand);text-decoration:none}
.mixl .it em{font-style:normal;text-align:right;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;margin-top:20px}
.btn.claro{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
footer{padding:30px 0 50px;color:var(--muted);font-size:12.5px}
.carregando{padding:80px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <a class="marca" href="#" data-aba="cidade" aria-label="Mirante, início">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="17" width="6" height="12" rx="2" fill="var(--r4)"/><rect x="10" y="10" width="6" height="19" rx="2" fill="var(--r2)"/><rect x="18" y="4" width="6" height="25" rx="2" fill="var(--focus)"/><rect x="26" y="13" width="4" height="16" rx="2" fill="var(--r5)"/></svg>
    <span>Mirante<small>mercado segurador</small></span></a>
  <nav class="abas" role="tablist">
    <button role="tab" data-aba="cidade">Cidade</button>
    <button role="tab" data-aba="mercado">Mercado</button>
    <button role="tab" data-aba="comparar">Comparar</button>
    <button role="tab" data-aba="seguradora">Seguradora</button>
    <button role="tab" data-aba="noticias">Notícias</button>
    <button role="tab" data-aba="como">Como ler</button>
  </nav>
  <div class="top-dir">
    <div class="foco-sel" title="A seguradora em destaque em todas as telas"><span class="pin"></span><label for="foco">Em destaque</label><select id="foco"></select></div>
    <button class="ib" id="tema" type="button" aria-label="Trocar tema claro ou escuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</div></header>
<main class="wrap" id="app"><div class="carregando">Carregando os dados da SUSEP…</div></main>
<footer class="wrap" id="rodape"></footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
// ============================ estado ============================
if(window.Chart){ Chart.defaults.font.family="'IBM Plex Sans',system-ui,sans-serif"; }
const ST={aba:'cidade',altura:'e',escolha:null,linha:'vida',ramos:null,per:'12m',nivel:'grupo',foco:null,comp:[],ntema:'',nseg:'',segAlvo:null};
const D={meta:null,bal:null,not:null,linhas:{},charts:{}};
const COMPOSTAS={pessoas:{nome:'Pessoas (todas)',ids:['vida','prestamista','ap','pessoas_outros']},todas:{nome:'Todos os ramos',ids:null}};
const PESSOAS=['vida','prestamista','ap','pessoas_outros'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ok=v=>v!=null&&isFinite(v);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const rotMes=m=>MES[+m.slice(4)-1]+'/'+m.slice(0,4);
const fBR=(v,d=1)=>v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
// valores chegam em R$ mil
const fV=v=>{ if(!ok(v)) return '—'; const a=Math.abs(v); if(a>=1e6) return 'R$ '+fBR(v/1e6,a>=1e7?1:2)+' bi'; if(a>=1e3) return 'R$ '+fBR(v/1e3,a>=1e5?0:1)+' mi'; return 'R$ '+fBR(v,0)+' mil'; };
const fP=(v,d=1,sinal=false)=>ok(v)?(sinal&&v>0?'+':'')+fBR(v*100,d)+'%':'—';
const cl=v=>ok(v)?(v>0?'pos':v<0?'neg':''):'';
const salva=()=>{ try{ localStorage.setItem('mirante',JSON.stringify({foco:ST.foco,linha:ST.linha,per:ST.per,nivel:ST.nivel,comp:ST.comp})); }catch{} };
try{ Object.assign(ST,JSON.parse(localStorage.getItem('mirante')||'{}')); }catch{}
async function getJSON(p){ const r=await fetch(p,{cache:'no-cache'}); if(!r.ok) throw new Error(p); return r.json(); }

// ============================ dados ============================
async function linhaRows(id){
  if(COMPOSTAS[id]){ const ids=COMPOSTAS[id].ids||D.meta.linhas.map(l=>l.id); const p=await Promise.all(ids.map(linhaRows)); return [].concat(...p); }
  if(!D.linhas[id]) D.linhas[id]=getJSON('data/ses/'+id+'.json').then(x=>x.rows).catch(()=>[]);
  return D.linhas[id];
}
function ramosDaLinha(id){
  const M=D.meta; if(COMPOSTAS[id]){ const ids=COMPOSTAS[id].ids||M.linhas.map(l=>l.id); return [].concat(...ids.map(ramosDaLinha)); }
  const l=M.linhas.find(x=>x.id===id); return l?l.ramos:[];
}
function nomeLinha(id){ return COMPOSTAS[id]?COMPOSTAS[id].nome:(D.meta.linhas.find(l=>l.id===id)||{}).nome||id; }
// período: índices dos meses atuais e do mesmo período um ano antes
function periodo(){
  const ms=D.meta.meses, n=ms.length, ult=ms[n-1];
  if(ST.per==='12m'){ const a=new Set(),b=new Set(); for(let i=n-12;i<n;i++){ a.add(i); b.add(i-12); } return {a,b,rot:`12 meses até ${rotMes(ult)}`,curto:'12 meses',comp:'12 meses anteriores'}; }
  if(ST.per==='ytd'){ const y=ult.slice(0,4), a=new Set(),b=new Set(); ms.forEach((m,i)=>{ if(m.slice(0,4)===y){ a.add(i); b.add(i-12); } }); return {a,b,rot:`jan a ${MES[+ult.slice(4)-1]}/${y}`,curto:'no ano',comp:`mesmo período de ${+y-1}`}; }
  const y=ST.per, a=new Set(),b=new Set(); ms.forEach((m,i)=>{ if(m.slice(0,4)===y) a.add(i); if(m.slice(0,4)===String(+y-1)) b.add(i); });
  return {a,b,rot:`ano de ${y}`,curto:y,comp:String(+y-1)};
}
const chave=r=>ST.nivel==='grupo'?D.meta.cias[r[1]][2]:r[1];
const nomeEnt=k=>ST.nivel==='grupo'?D.meta.grupos[k][1]:D.meta.cias[k][1];
function focoKey(){ if(ST.foco==null) return null; return ST.nivel==='grupo'?ST.foco:null; }
function ehFoco(k){ return ST.nivel==='grupo'?k===ST.foco:D.meta.cias[k][2]===ST.foco; }
function agrega(rows,set,ramoSet){
  const m=new Map();
  for(const r of rows){ if(!set.has(r[0])) continue; if(ramoSet&&!ramoSet.has(r[2])) continue;
    const k=chave(r); let a=m.get(k); if(!a){ a=[0,0,0,0]; m.set(k,a); } a[0]+=r[3]; a[1]+=r[4]; a[2]+=r[5]; a[3]+=r[6]; }
  return m;
}
function ranking(rows){
  const P=periodo(), rs=ST.ramos?new Set(ST.ramos):null;
  const A=agrega(rows,P.a,rs), B=agrega(rows,P.b,rs);
  const tot=[...A.values()].reduce((s,a)=>s+a[0],0), totB=[...B.values()].reduce((s,a)=>s+a[0],0);
  const lista=[...A.entries()].filter(([k,a])=>a[0]>0).map(([k,a])=>{ const b=B.get(k)||[0,0,0,0];
    return {k,nome:nomeEnt(k),emit:a[0],ganho:a[1],sin:a[2],com:a[3],share:a[0]/tot,cres:b[0]>0?a[0]/b[0]-1:null,
      sinist:a[1]>0?a[2]/a[1]:null,comis:a[1]>0?a[3]/a[1]:null,emitB:b[0]}; }).sort((x,y)=>y.emit-x.emit);
  const posB=[...B.entries()].filter(([k,a])=>a[0]>0).sort((x,y)=>y[1][0]-x[1][0]).map(([k])=>k);
  lista.forEach((r,i)=>{ r.pos=i+1; const j=posB.indexOf(r.k); r.posB=j>=0?j+1:null; });
  const merc={emit:tot,emitB:totB,cres:totB>0?tot/totB-1:null,ganho:lista.reduce((s,r)=>s+r.ganho,0),sin:lista.reduce((s,r)=>s+r.sin,0),com:lista.reduce((s,r)=>s+r.com,0)};
  merc.sinist=merc.ganho>0?merc.sin/merc.ganho:null; merc.comis=merc.ganho>0?merc.com/merc.ganho:null;
  return {lista,merc,P};
}
// série de 12 meses móveis por entidade (prêmio emitido) e por mercado
function serie12(rows,keys,campo=0){
  const n=D.meta.meses.length, rs=ST.ramos?new Set(ST.ramos):null, idx=new Map(keys.map((k,i)=>[k,i]));
  const mens=keys.map(()=>new Float64Array(n)), tot=new Float64Array(n), ganho=keys.map(()=>new Float64Array(n)), totG=new Float64Array(n);
  for(const r of rows){ if(rs&&!rs.has(r[2])) continue; const v=r[3+campo]; tot[r[0]]+=v; totG[r[0]]+=r[4]; const i=idx.get(chave(r)); if(i!=null){ mens[i][r[0]]+=v; ganho[i][r[0]]+=r[4]; } }
  const roll=a=>{ const o=new Array(n).fill(null); let s=0; for(let i=0;i<n;i++){ s+=a[i]; if(i>=12) s-=a[i-12]; if(i>=11) o[i]=s; } return o; };
  return {ent:mens.map(roll),tot:roll(tot),ganho:ganho.map(roll),totG:roll(totG)};
}

function hash(a,b,c){ let h=(a*374761393+b*668265263+c*2147483647)>>>0; h=(h^(h>>>13))*1274126177>>>0; return (h%1000)/1000; }
function cenaSVG(lista){
  const W=1200,H=545,chao=430, n=lista.length, key=ST.altura;
  const val=r=>key==='lucro'?Math.max(0,r.lucro||0):r[key];
  const max=Math.max(...lista.map(val))||1;
  // andar "redondo": o mais alto fica com cerca de 32 andares
  const passos=[1e4,2e4,5e4,1e5,2e5,5e5,1e6,2e6,5e6]; const andar=passos.find(p=>max/p<=36)||5e6;
  const hAndar=Math.min(11,330/(max/andar));
  // os maiores no centro, alternando para os lados
  const ord=[]; [...lista].sort((a,b)=>val(b)-val(a)).forEach((r,i)=>{ if(i%2) ord.push(r); else ord.unshift(r); });
  const passo=(W-60)/n, w=Math.min(46,passo*0.62), dep=Math.min(16,w*.34);
  let out=`<defs><linearGradient id="fa" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5F7FE8"/><stop offset="1" stop-color="#23397F"/></linearGradient>
   <linearGradient id="fa-f" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFC24D"/><stop offset="1" stop-color="#C77D00"/></linearGradient>
   <radialGradient id="lua" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6DD"/><stop offset="1" stop-color="#FFF6DD" stop-opacity="0"/></radialGradient></defs>
   <circle cx="1060" cy="92" r="70" fill="url(#lua)" opacity=".35"/><circle cx="1060" cy="92" r="20" fill="#FFF3D1" opacity=".9"/>`;
  for(let i=0;i<70;i++) out+=`<circle cx="${(hash(i,1,7)*W).toFixed(0)}" cy="${(hash(i,2,9)*230).toFixed(0)}" r="${hash(i,3,1)<.85?1:1.6}" fill="#fff" opacity="${(.25+hash(i,4,2)*.5).toFixed(2)}"/>`;
  out+=`<rect x="0" y="${chao}" width="${W}" height="${H-chao}" fill="#0A1A3F"/><rect x="0" y="${chao}" width="${W}" height="2" fill="#7E97F2" opacity=".5"/>`;
  ord.forEach((r,k)=>{
    const v=val(r), andares=Math.max(1,Math.round(v/andar)), h=Math.max(14,v/andar*hAndar), x=30+k*passo+(passo-w)/2, y=chao-h, foco=r.g===ST.foco;
    const cols=Math.max(2,Math.floor((w-8)/8)), linhas=Math.max(1,Math.floor((h-8)/Math.max(hAndar,7)));
    const acesas=ok(r.cres)?Math.min(.95,Math.max(.12,.35+r.cres*2.2)):.3;
    let jan='';
    for(let a=0;a<linhas;a++) for(let c=0;c<cols;c++){ const lit=hash(r.g,a,c)<acesas;
      jan+=`<rect x="${(x+5+c*((w-10)/cols)).toFixed(1)}" y="${(y+6+a*((h-10)/linhas)).toFixed(1)}" width="${Math.max(2,(w-10)/cols-3).toFixed(1)}" height="${Math.max(2,(h-10)/linhas-3).toFixed(1)}" rx=".6" fill="${lit?(foco?'#FFF1C9':'#FFD27A'):'#18295C'}" opacity="${lit?(.75+hash(c,a,r.g)*.25).toFixed(2):.9}"/>`; }
    const nome=r.nome.length>13?r.nome.slice(0,12)+'…':r.nome, ly=chao+(k%2?24:58);
    out+=`<g class="predio ${ST.escolha===r.g?'ativo':''}" data-predio="${r.g}" tabindex="0" role="button" aria-label="${esc(r.nome)}: ${fV(r.e)} em prêmios" style="animation-delay:${(Math.abs(k-n/2)*45).toFixed(0)}ms">
      <title>${esc(r.nome)} · ${ALTURAS[key]}: ${fV(v)}</title>
      <polygon points="${x+w},${y} ${x+w+dep},${y-dep*.55} ${x+w+dep},${chao-dep*.55} ${x+w},${chao}" fill="${foco?'#9A6200':'#1A2C66'}"/>
      <polygon points="${x},${y} ${x+dep},${y-dep*.55} ${x+w+dep},${y-dep*.55} ${x+w},${y}" fill="${foco?'#FFD98A':'#8EA7F8'}"/>
      <rect class="fachada" x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${foco?'fa-f':'fa'})"/>${jan}
      ${r.pos<=3&&key==='e'?`<rect x="${x+w/2-1}" y="${y-dep*.55-18}" width="2" height="18" fill="#C9D6FF"/><circle cx="${x+w/2}" cy="${y-dep*.55-19}" r="2.5" fill="#FF6B6B"/>`:''}
      <line x1="${x+w/2}" y1="${chao+3}" x2="${x+w/2}" y2="${ly-12}" stroke="#7E97F2" stroke-opacity=".35"/>
      <text class="rot ${foco?'f':''}" x="${x+w/2}" y="${ly}">${esc(nome)}</text>
      <text class="rot" x="${x+w/2}" y="${ly+14}" style="opacity:.7">${fV(v).replace('R$ ','')}</text></g>`;
  });
  return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cidade das seguradoras: cada prédio é um grupo, a altura é ${ALTURAS[key].toLowerCase()}">${out}</svg>`,andar};
}

  if($('#ch-anos')){ const anos=Object.keys(B.anos).sort(); const o=optsBase(fV);
    D.charts.anos=new Chart($('#ch-anos'),{type:'bar',data:{labels:anos,datasets:[{label:'Lucro líquido',data:anos.map(a=>B.anos[a].lucro),backgroundColor:css('--focus'),borderRadius:6},{label:'Patrimônio líquido',data:anos.map(a=>B.anos[a].pl),backgroundColor:css('--r5'),borderRadius:6}]},options:o}); }
}

// ============================ notícias ============================
function notHTML(it,comSeg){
  const d=it.data.split('-').reverse().slice(0,2).join('/');
  return `<article class="nt"><time datetime="${esc(it.data)}">${d}/${it.data.slice(2,4)}</time><div><a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.titulo)}</a>
   <div class="meta">${comSeg?`<span class="tag ins">${esc(comSeg)}</span>`:''}${(it.temas||[]).filter(t=>t!=='Geral').map(t=>`<span class="tag ${esc(t)}">${esc(t)}</span>`).join('')}<span>${esc(it.fonte||'')}</span></div></div></article>`;
}
function vNoticias(){
  const M=D.meta, N=D.not, app=$('#app');
  if(!N||!N.grupos){ app.innerHTML='<section class="abertura"><h1>Notícias do mercado</h1></section><div class="painel"><div class="painel-b"><div class="vazio">As notícias aparecem depois da primeira atualização automática do site.</div></div></div>'; return; }
  const gidIdx=new Map(M.grupos.map((g,i)=>[g[0],i]));
  let todas=[]; for(const [gid,its] of Object.entries(N.grupos)){ const i=gidIdx.get(gid); if(i==null) continue; its.forEach(it=>todas.push({...it,g:i})); }
  N.mercado.forEach(it=>todas.push({...it,g:-1}));
  const temas=['Produto','Marketing','Resultado','Parceria','Aquisição','Pessoas','Regulação'];
  const filt=todas.filter(it=>(!ST.ntema||(it.temas||[]).includes(ST.ntema))&&(ST.nseg===''||(ST.nseg==='m'?it.g===-1:it.g===+ST.nseg)));
  const vistos=new Set(), lst=filt.sort((a,b)=>b.data.localeCompare(a.data)).filter(it=>{ const k=it.titulo.toLowerCase().slice(0,60); if(vistos.has(k)) return false; vistos.add(k); return true; });
  const comN=[...new Set(todas.filter(i=>i.g>=0).map(i=>i.g))].sort((a,b)=>M.grupos[a][1].localeCompare(M.grupos[b][1],'pt'));
  app.innerHTML=`<section class="abertura"><h1>O que as seguradoras andam fazendo</h1><div class="sub"><span>lançamentos, campanhas, resultados e mudanças, das notícias dos últimos 60 dias</span><span>atualizado em ${N.atualizado.split(' ')[0].split('-').reverse().join('/')}</span></div></section>
   <div class="filtros"><div class="linhas" role="group" aria-label="Tema"><button class="chip" data-ntema="" aria-pressed="${!ST.ntema}">Todos os temas</button>${temas.map(t=>`<button class="chip" data-ntema="${t}" aria-pressed="${ST.ntema===t}">${t}</button>`).join('')}</div>
    <div class="ctrl"><label for="nseg">Seguradora</label><select id="nseg"><option value="">Todas</option><option value="m" ${ST.nseg==='m'?'selected':''}>Mercado em geral</option>${comN.map(i=>`<option value="${i}" ${String(i)===ST.nseg?'selected':''}>${esc(M.grupos[i][1])}</option>`).join('')}</select></div></div>
   <section class="painel" style="margin:12px 0 26px"><div class="painel-b">${lst.length?`<div class="nots">${lst.slice(0,120).map(it=>notHTML(it,it.g>=0?M.grupos[it.g][1]:'Mercado')).join('')}</div>`:'<div class="vazio">Nenhuma notícia com esse filtro. Tente outro tema ou outra seguradora.</div>'}</div></section>
   <p class="nota">As notícias vêm do Google Notícias, buscadas pelo nome de cada grupo. Os temas são marcados pelas palavras do título e podem errar de vez em quando.</p>`;
}

// ============================ como ler ============================
function vComo(){
  $('#app').innerHTML=`<section class="abertura"><h1>Como ler os números</h1></section>
  <section class="painel como" style="margin:18px 0 26px"><div class="painel-b">
   <h3>De onde vêm os dados</h3><p>Do Sistema de Estatísticas da SUSEP (SES), que reúne o que cada seguradora informa todo mês no FIP. O site baixa a base completa automaticamente sempre que a SUSEP publica uma versão nova (em geral, toda semana). Os números costumam ter cerca de dois meses de atraso, e a SUSEP pode revisar meses anteriores.</p>
   <h3>Os indicadores</h3><ul>
    <li><b>Prêmio emitido:</b> o valor dos seguros vendidos no período (campo premio_emitido2 do SES). É a base do ranking e da participação.</li>
    <li><b>Crescimento:</b> prêmio emitido do período contra o mesmo período do ano anterior. Valores nominais, sem descontar a inflação.</li>
    <li><b>Sinistralidade:</b> sinistros ocorridos ÷ prêmio ganho. Quanto do prêmio voltou para os segurados.</li>
    <li><b>Comissão:</b> despesas de comercialização ÷ prêmio ganho. Quanto ficou com corretores e canais de venda.</li>
    <li><b>Índice combinado:</b> sinistros, comissões, despesas administrativas, tributos, resseguro e outras despesas operacionais ÷ prêmio ganho, pelo balanço. Abaixo de 100%, a operação de seguros dá lucro antes do resultado financeiro.</li>
    <li><b>Lucro, patrimônio e ROE:</b> do balanço que a seguradora entrega à SUSEP. Lucro de 12 meses ÷ patrimônio líquido.</li></ul>
   <h3>Grupos e empresas</h3><p>"Grupos" soma todas as empresas de um mesmo grupo econômico, como a SUSEP classifica hoje. O histórico também é somado com a composição atual, para comparar o mesmo conjunto de empresas ao longo do tempo. "Empresas" mostra cada seguradora separada.</p>
   <h3>Linhas de negócio</h3><p>Cada ramo da SUSEP entra em uma linha. Vida reúne vida em grupo, vida individual e os ramos de vida em extinção. Prestamista e acidentes pessoais ficam separados. Previdência (VGBL e PGBL) e DPVAT não entram. Dentro de cada linha você pode marcar e desmarcar os ramos.</p>
   <h3>Notícias</h3><p>Buscadas todo dia no Google Notícias pelo nome de cada grupo grande. O tema (produto, marketing, resultado…) é identificado pelas palavras do título.</p>
   <h3>Aviso</h3><p>Painel independente feito com dados públicos. Não tem vínculo nem validação da SUSEP ou de qualquer seguradora.</p>
  </div></section>`;
}

// ============================ eventos ============================
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-aba]'); if(a){ e.preventDefault(); setAba(a.dataset.aba); return; }
  const l=e.target.closest('[data-linha]'); if(l){ ST.linha=l.dataset.linha; ST.ramos=null; salva(); render(); return; }
  const ra=e.target.closest('[data-ramo]'); if(ra){ const todos=ramosDaLinha(ST.linha), i=+ra.dataset.ramo; let s=ST.ramos?[...ST.ramos]:[...todos];
    s=s.includes(i)?s.filter(x=>x!==i):s.concat([i]); if(!s.length||s.length===todos.length) s=null; ST.ramos=s; render(); return; }
  const nv=e.target.closest('[data-nivel]'); if(nv){ ST.nivel=nv.dataset.nivel; ST.comp=[]; salva(); render(); return; }
  const en=e.target.closest('[data-ent]'); if(en){ const k=+en.dataset.ent; ST.segAlvo=ST.nivel==='grupo'?k:D.meta.cias[k][2]; setAba('seguradora'); return; }
  const li=e.target.closest('[data-linha-ir]'); if(li){ ST.linha=li.dataset.linhaIr; ST.ramos=null; salva(); setAba('mercado'); return; }
  const ti=e.target.closest('[data-tira]'); if(ti){ ST.comp=(ST.compAtual||[]).filter(k=>k!==+ti.dataset.tira); if(!ST.comp.length) ST.comp=[-1]; salva(); render(); return; }
  const nt=e.target.closest('[data-ntema]'); if(nt){ ST.ntema=nt.dataset.ntema; render(); return; }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='foco'){ ST.foco=+el.value; salva(); render(); }
  if(el.id==='per'){ ST.per=el.value; salva(); render(); }
  if(el.id==='linha-outra'&&el.value){ ST.linha=el.value; ST.ramos=null; salva(); render(); }
  if(el.id==='c-add'&&el.value!==''){ ST.comp=(ST.compAtual||[]).filter(k=>k>=0).concat([+el.value]); salva(); render(); }
  if(el.id==='seg-alvo'){ ST.segAlvo=+el.value; render(); }
  if(el.id==='nseg'){ ST.nseg=el.value; render(); }
});
// tema
const TEMA_K='mirante-tema';
function aplicaTema(t){ const r=document.documentElement; if(t) r.setAttribute('data-theme',t); else r.removeAttribute('data-theme'); }
try{ aplicaTema(localStorage.getItem(TEMA_K)); }catch{}
$('#tema').addEventListener('click',()=>{ const escuro=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
  const t=escuro?'light':'dark'; aplicaTema(t); try{ localStorage.setItem(TEMA_K,t); }catch{} render(); });

// ============================ início ============================
(async function(){
  try{ D.meta=await getJSON('data/meta.json'); }catch{ $('#app').innerHTML='<div class="vazio">Os dados ainda não foram gerados. Rode a atualização automática na aba Actions do GitHub.</div>'; return; }
  [D.bal,D.not]=await Promise.all([getJSON('data/balanco.json').catch(()=>null),getJSON('data/noticias.json').catch(()=>null)]);
  const M=D.meta;
  if(ST.foco==null||!M.grupos[ST.foco]){ let h=M.grupos.findIndex(g=>g[0].startsWith('g:')&&/^HDI\b/i.test(g[1])); if(h<0) h=M.grupos.findIndex(g=>/^HDI\b/i.test(g[1])); ST.foco=h>=0?h:null; }
  if(!M.linhas.find(l=>l.id===ST.linha)&&!COMPOSTAS[ST.linha]) ST.linha='vida';
  if(!['12m','ytd'].includes(ST.per)&&!M.meses.some(m=>m.startsWith(ST.per))) ST.per='12m';
  const opts=[...M.grupos.keys()].sort((a,b)=>M.grupos[a][1].localeCompare(M.grupos[b][1],'pt'));
  $('#foco').innerHTML=opts.map(i=>`<option value="${i}" ${i===ST.foco?'selected':''}>${esc(M.grupos[i][1])}</option>`).join('');
  rodape(); setAba('cidade');
})();
</script>
